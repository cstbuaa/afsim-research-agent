# Tactical capability groups: the coarse view of the capability set.
#
# First drafts are judged at group level: only the core groups of a platform class are
# checked entry by entry; the other groups take part in the simulation but, when the
# platform lacks something, it is handled by the simplification below instead of becoming
# a gap. Detail entries are left out of a first draft altogether. The user refines a group
# when the tactic needs it (`refine`), which brings back the precise judgment and the
# detail entries for that group.
#
# Which capability-set entries belong to which group is kept next to the local capability
# set (`group_members.toml`), because it lists the lab's entry ids. Every entry belongs to
# exactly one group (tests check this when the set is present).

[meta]
version = "capability-groups-2026.10.2"
detail_default = "细节项按默认值处理（如燃油充足、弹药不限、设备常开）"

[class.ground_vehicle]
core = ["maneuver", "formation", "terrain"]
not_applicable = ["set_altitude", "self_value.altitude"]

[class.default]
core = ["maneuver", "formation", "terrain"]

[group.maneuver]
display_name = "机动"
simplification = "理想机动：按指定路线与速度运动"

[group.formation]
display_name = "编队"
simplification = "理想编队：按队形偏移直接保持站位"

[group.terrain]
display_name = "地形判断"
simplification = "简化地形：按想定给出的地形区域判断，通视按距离近似"

[group.sensing]
display_name = "观察发现"
simplification = "理想观察：探测范围内的目标直接可见，敌我属性取仿真真值"

[group.comms]
display_name = "通信报告"
simplification = "理想通信：消息即时送达、不丢失"

[group.fires]
display_name = "火力"
simplification = "简化火力：射击只记录动作与目标，不计算毁伤，射程按参数判断"

[group.command]
display_name = "指挥与任务"
simplification = "指挥关系按编制静态确定，任务分配由行为逻辑直接决定"

[group.sustainment]
display_name = "保障与状态"
simplification = "默认状态良好：燃油、动力充足，平台完好"

[group.control]
display_name = "任务控制"
simplification = "由行为模型运行时提供（状态机、计时、黑板变量）"

[group.ew]
display_name = "电子与网络对抗"
simplification = "不建模"

# IR elements by group when no entry implements them (decides gap vs simplification), and
# IR elements that are detail on their own.
[ir.groups]
"in_group" = "control"
"self_value.instance_index" = "control"
"simulation_value.tick" = "control"
"simulation_value.time" = "control"
"set_blackboard" = "control"
"delete_blackboard_value" = "control"
"blackboard" = "control"
"wait" = "control"
"time_in_state_gte" = "control"
"turn_controller_on" = "control"
"turn_controller_off" = "control"
"set_altitude" = "maneuver"
"self_value.altitude" = "maneuver"
"move_to_platform" = "formation"
"follow_route_with_offset" = "formation"
"bounding_turn" = "formation"
"orient_sensor" = "sensing"
"send_message" = "comms"
"message_received" = "comms"
"self_value.alive" = "sustainment"
"self_value.damaged" = "sustainment"
"self_value.fuel_remaining" = "sustainment"
"self_value.fuel_reserve" = "sustainment"
"set_reserve_threshold" = "sustainment"
"terrain_value.class" = "terrain"
"terrain_value.distance_to_class" = "terrain"
"terrain_value.slope" = "terrain"
"terrain_value.line_of_sight_to_nearest_hostile" = "terrain"

[ir]
detail = [
  "simulation_value.tick", "delete_blackboard_value", "turn_sensor_on", "turn_sensor_off",
  "orient_sensor", "turn_controller_on", "turn_controller_off", "self_value.fuel_remaining",
  "self_value.fuel_reserve", "set_reserve_threshold", "weapon_value.quantity_remaining",
  "sensor_value.on", "comm_value.available",
]
