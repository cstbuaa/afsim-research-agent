# Vocabulary alignment between Tactical Behavior IR 1.0 and the platform capability catalog
# (design/capability-catalog-integration-v1.md §3.2).
#
# References: "<capability_id>" (capability-level status) or
#             "<capability_id>:<interface ir>" (one accepts/provides entry).
#
# [binding.<ir capability id>]  role dependencies in IR (route_following_ground, voice_data, ...)
#   uses   = all of these are needed
#
# [element.<ir name>]  IR actions / operand properties / functions that have no direct `ir_v1`
#   link in the catalog. Elements with a direct link are resolved from the catalog itself.
#   uses    = all of these are needed
#   any_of  = alternative ways to obtain it; each alternative is a list (all of it needed)
#   static  = true: fixed by the model definition at load time, needs no platform interface
#   override = true: use this entry even though the catalog links the element directly
#             (the direct link hides a dependency, e.g. keep_station needs the leader's position)
#   note    = why the element maps this way (shown in reports)

[meta]
version = "capability-aliases-2026.10.1"

# ---------------------------------------------------------------- role dependencies
[binding.route_following_ground]
uses = ["route_navigation", "ground_navigation"]
[binding.route_following_air]
uses = ["route_navigation", "air_navigation"]
[binding.route_following_surface]
uses = ["route_navigation", "surface_navigation"]
[binding.visual_search]
uses = ["eo_ir_search", "target_detection"]
[binding.thermal_search]
uses = ["eo_ir_search", "target_detection"]
[binding.radar_search]
uses = ["radar_search", "target_detection"]
[binding.voice_data]
uses = ["message_exchange", "radio_comm"]
[binding.data_link]
uses = ["message_exchange", "data_link_communication"]
[binding.direct_fire]
uses = ["direct_fire_engagement", "direct_acting_weapon"]
[binding.guided_missile]
uses = ["guided_weapon_engagement", "launched_munition"]
[binding.fuel_tracking]
uses = ["fuel_status_monitoring"]
[binding.mission_processor]
uses = ["state_machine_execution", "behavior_tree_execution"]

# ---------------------------------------------------------------- movement
[element.move_to_track]
uses = ["point_navigation:mobility_action.go_to_location", "target_tracking:track_state.latitude"]
note = "前往航迹位置 = 定点机动 + 读取航迹位置"

[element.move_to_platform]
uses = ["point_navigation:mobility_action.go_to_location"]
any_of = [
  ["message_exchange:communication_action.send_message", "message_exchange:communication_message.received_type"],
  ["target_detection", "target_tracking:track_state.latitude", "track_identification:track_state.reported_type"],
]
note = "前往友方平台：对方位置由消息广播或友方航迹获得"

[element."mover_value.available"]
any_of = [
  ["component_health_management:component_state.operational"],
  ["platform_status_monitoring:platform_state.damage_fraction"],
]
note = "运动部件可用：组件可操作状态，或以平台损伤程度近似"

[element."mover_value.moving"]
uses = ["own_kinematic_state:platform_state.speed"]
note = "速度大于阈值即在运动"

# ---------------------------------------------------------------- own platform
[element."self_value.alive"]
uses = ["platform_status_monitoring:platform_state.damage_fraction"]
[element."self_value.damaged"]
uses = ["platform_status_monitoring:platform_state.damage_fraction"]
[element."self_value.fuel_remaining"]
uses = ["fuel_status_monitoring:resource_state.fuel_remaining_mass"]
[element."self_value.fuel_reserve"]
uses = ["fuel_status_monitoring:resource_state.fuel_threshold_event"]
[element.set_reserve_threshold]
uses = ["fuel_status_monitoring"]
note = "储备阈值为燃料监测的设置；运行中修改阈值的接口未见"
[element."self_value.instance_index"]
static = true
note = "角色实例编号由模型定义确定"

# ---------------------------------------------------------------- sensors
[element.turn_sensor_on]
uses = ["sensor_control:sensing_action.set_sensor_power"]
[element.turn_sensor_off]
uses = ["sensor_control:sensing_action.set_sensor_power"]
[element.orient_sensor]
uses = ["sensor_cueing:sensing_action.cue_to_track"]
[element."sensor_value.on"]
uses = ["sensor_control:sensor_state.power"]
[element."sensor_value.available"]
any_of = [
  ["component_health_management:component_state.operational"],
  ["platform_status_monitoring:platform_state.damage_fraction"],
]
[element."sensor_value.track_count"]
uses = ["track_management:track_state.managed_track"]

# ---------------------------------------------------------------- tracks
[element."track_value.nearest_hostile_range"]
uses = [
  "target_tracking:track_state.latitude",
  "own_kinematic_state:platform_state.position",
  "track_identification:track_state.affiliation",
]
note = "最近敌方距离 = 航迹位置与自身位置计算距离，并按敌我属性筛选"

[element."track_value.hostile_count"]
uses = ["track_management:track_state.managed_track", "track_identification:track_state.affiliation"]

[element."track_value.current_target_id"]
uses = ["track_management:track_state.managed_track", "behavior_variables:execution_state.variable"]
note = "当前目标由行为模型选定并保存在行为变量中"

[element."track_value.current_target_valid"]
uses = ["target_tracking:track_state.location_valid"]

# ---------------------------------------------------------------- formation and team
[element.keep_station]
override = true
uses = ["own_kinematic_state:platform_state.position", "point_navigation:mobility_action.go_to_location",
        "speed_control:mobility_action.set_speed"]
any_of = [
  ["message_exchange:communication_action.send_message", "message_exchange:communication_message.received_type"],
  ["target_detection", "target_tracking:track_state.latitude", "track_identification:track_state.reported_type"],
  ["formation_following"],
]
note = "保持站位需要领车位置：领车广播（发送+接收）、友方航迹，或由运动组件固定偏移跟随（不支持运行中换队形）"

[element.formation_is]
uses = ["behavior_variables:execution_state.variable"]
note = "当前队形保存在行为变量中"

[element."formation_value.current_id"]
uses = ["behavior_variables:execution_state.variable"]

[element."formation_value.leader_distance"]
uses = ["own_kinematic_state:platform_state.position"]
any_of = [
  ["message_exchange:communication_action.send_message", "message_exchange:communication_message.received_type"],
  ["target_detection", "target_tracking:track_state.latitude", "track_identification:track_state.reported_type"],
]
note = "到领车距离：领车位置由消息广播（领车发送、本车接收）或友方航迹获得"

[element."team_value.nearest_friend_distance"]
uses = ["own_kinematic_state:platform_state.position"]
any_of = [
  ["message_exchange:communication_action.send_message", "message_exchange:communication_message.received_type"],
  ["target_detection", "target_tracking:track_state.latitude", "track_identification:track_state.reported_type"],
]

[element."team_value.formation_error_rms"]
uses = ["own_kinematic_state:platform_state.position"]
any_of = [
  ["message_exchange:communication_action.send_message", "message_exchange:communication_message.received_type"],
  ["target_detection", "target_tracking:track_state.latitude", "track_identification:track_state.reported_type"],
]
note = "编队误差需要全体成员位置"

[element."team_value.members_in_position"]
uses = ["own_kinematic_state:platform_state.position"]
any_of = [
  ["message_exchange:communication_action.send_message", "message_exchange:communication_message.received_type"],
  ["target_detection", "target_tracking:track_state.latitude", "track_identification:track_state.reported_type"],
]

[element."team_value.members_alive"]
any_of = [
  ["message_exchange:communication_action.send_message", "message_exchange:communication_message.received_type"],
  ["track_management:track_state.managed_track"],
]
note = "成员存活由周期状态消息或航迹丢失推断"

# ---------------------------------------------------------------- coordination functions
[element.bounding_turn]
uses = ["message_exchange:communication_message.received_type", "behavior_variables:execution_state.variable"]
note = "跃进轮次由收到的跃进完成消息推算"

[element.standoff_reached]
uses = [
  "target_tracking:track_state.latitude",
  "own_kinematic_state:platform_state.position",
  "track_identification:track_state.affiliation",
]
note = "与最近敌方距离不超过安全距离"

[element.in_group]
static = true
note = "协同分组由模型定义确定"
