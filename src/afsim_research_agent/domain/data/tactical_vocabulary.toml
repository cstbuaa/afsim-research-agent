# Controlled tactical vocabulary.
#
# Used to (1) give the planner a glossary of professional terms, (2) expand
# queries deterministically, (3) route doctrine queries to the right
# publications and (4) build Chinese search strings for manual CNKI/Wanfang work.
#
# Matching is case-insensitive substring matching on the requirement, research
# questions and key terms, over `preferred`, `en` and `zh`.
# `doctrine` must list real publication designations only.

