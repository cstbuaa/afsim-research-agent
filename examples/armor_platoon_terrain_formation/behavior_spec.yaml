# Tactical Behavior IR 1.0 — multi-role example.
#
# All numeric values below are ILLUSTRATIVE placeholders entered as
# user_specified so the pipeline can run end to end. They are not doctrine
# values. Falcon replaces them with Crow evidence (status explicit/inferred,
# confirmation pending) and a person confirms them before compilation.
schema_version: "1.0"

model:
  id: armor_platoon_terrain_formation
  display_name: 装甲排地形自适应编队（示例）
  version: 0.1.0
  description: 装甲排沿路线机动，开阔地用楔形、接近城区转纵队；接敌时报告并转入交替跃进。
  intent: formation_transition
  authoring_mode: user_authored
  domain_concepts: [unit.tank_platoon, formation.wedge, formation.column, movement.techniques, terrain.urban]

provenance:
  requirements:
    - source_id: user_req_001
      kind: user_input
      locator: conversation
      summary: 研究装甲车在不同地形下的编队方式，并在接敌时转换。
  references: []

assumptions:
  - id: assumption_comms
    statement: 排内所有车辆具备可用的语音/数据通信。
    affects: [coord_leader_follower, coord_contact_report]
    requires_confirmation: true
    confirmation: confirmed
    confirmed_by: example_reviewer

execution:
  architecture: state_machine_with_behavior_trees
  controller_name: tactical_controller
  update_interval: {value: 1, unit: sec}
  deterministic: true
  random_seed_parameter: null
  debug: {behavior_tree_trace: true, state_transitions: true, script_writes: false}

roles:
  - id: platoon_leader
    description: 排长车
    count: 1
    capability_class: ground_vehicle
    command: {superior: null, subordinates: [wingman]}
    dependencies:
      mover: {required: true, capability: route_following_ground}
      sensors:
        - {id: vehicle_sight, capability: visual_search, required: true}
      comms:
        - {id: platoon_net, capability: voice_data, required: true}
      weapons: []
    blackboards:
      - id: mission
        scope: platform
        variables:
          - {name: current_formation, type: string, default: wedge}
    state_machine:
      id: leader_mission
      initial_state: travel_open
      states:
        - id: travel_open
          tree: leader_open_tree
          transitions:
            - transition_id: open_to_contact
              to: contact
              priority: 100
              when: {condition_ref: in_contact}
              synchronize_with: coord_leader_follower
              basis: {status: user_specified, confirmation: confirmed}
            - transition_id: open_to_urban
              to: travel_urban
              priority: 80
              when: {condition_ref: entering_urban}
              synchronize_with: coord_leader_follower
              basis: {status: user_specified, confirmation: confirmed}
            - {transition_id: open_self, to: travel_open, priority: 0, when: {literal: true}}
        - id: travel_urban
          tree: leader_urban_tree
          transitions:
            - transition_id: urban_to_contact
              to: contact
              priority: 100
              when: {condition_ref: in_contact}
              synchronize_with: coord_leader_follower
              basis: {status: user_specified, confirmation: confirmed}
            - transition_id: urban_to_open
              to: travel_open
              priority: 80
              when: {condition_ref: leaving_urban}
              synchronize_with: coord_leader_follower
              basis: {status: user_specified, confirmation: confirmed}
            - {transition_id: urban_self, to: travel_urban, priority: 0, when: {literal: true}}
        - id: contact
          tree: leader_contact_tree
          transitions:
            - transition_id: contact_to_open
              to: travel_open
              priority: 50
              when: {condition_ref: contact_cleared}
              synchronize_with: coord_leader_follower
              basis: {status: user_specified, confirmation: confirmed}
            - {transition_id: contact_self, to: contact, priority: 0, when: {literal: true}}

  - id: wingman
    description: 僚车（3 辆）
    count: 3
    capability_class: ground_vehicle
    command: {superior: platoon_leader, subordinates: []}
    dependencies:
      mover: {required: true, capability: route_following_ground}
      sensors:
        - {id: vehicle_sight, capability: visual_search, required: true}
      comms:
        - {id: platoon_net, capability: voice_data, required: true}
      weapons: []
    blackboards:
      - id: mission
        scope: platform
        variables:
          - {name: contact_reported, type: bool, default: false}
    state_machine:
      id: wingman_mission
      initial_state: travel_open
      states:
        - id: travel_open
          tree: wingman_travel_tree
          transitions:
            - transition_id: wing_open_contact
              to: contact
              priority: 100
              when: {condition_ref: in_contact}
              basis: {status: user_specified, confirmation: confirmed}
            - {transition_id: wing_open_self, to: travel_open, priority: 0, when: {literal: true}}
        - id: travel_urban
          tree: wingman_travel_tree
          transitions:
            - transition_id: wing_urban_contact
              to: contact
              priority: 100
              when: {condition_ref: in_contact}
              basis: {status: user_specified, confirmation: confirmed}
            - {transition_id: wing_urban_self, to: travel_urban, priority: 0, when: {literal: true}}
        - id: contact
          tree: wingman_contact_tree
          transitions:
            - {transition_id: wing_contact_self, to: contact, priority: 0, when: {literal: true}}

formations:
  - id: wedge
    description: 楔形：两翼在长车后侧，第三车居中殿后
    slots:
      - {role_instance: "wingman[0]", forward: {parameter_ref: wedge_depth, scale: -1}, right: {parameter_ref: wedge_half_width, scale: -1}}
      - {role_instance: "wingman[1]", forward: {parameter_ref: wedge_depth, scale: -1}, right: {parameter_ref: wedge_half_width}}
      - {role_instance: "wingman[2]", forward: {parameter_ref: wedge_depth, scale: -2}, right: {literal_distance: {value: 0, unit: m}}}
    tolerance: {parameter_ref: station_tolerance}
    basis: {status: user_specified, confirmation: confirmed}
  - id: column
    description: 纵队：依次跟随长车
    slots:
      - {role_instance: "wingman[0]", forward: {parameter_ref: column_interval, scale: -1}, right: {literal_distance: {value: 0, unit: m}}}
      - {role_instance: "wingman[1]", forward: {parameter_ref: column_interval, scale: -2}, right: {literal_distance: {value: 0, unit: m}}}
      - {role_instance: "wingman[2]", forward: {parameter_ref: column_interval, scale: -3}, right: {literal_distance: {value: 0, unit: m}}}
    tolerance: {parameter_ref: station_tolerance}
    basis: {status: user_specified, confirmation: confirmed}

coordination:
  - id: coord_leader_follower
    pattern: leader_follower
    leader: platoon_leader
    followers: wingman
    formation_ref: {blackboard_value: platoon_leader.mission.current_formation}
    basis: {status: user_specified, confirmation: confirmed}
  - id: coord_bounding
    pattern: bounding_overwatch
    groups:
      bounding: [platoon_leader, "wingman[2]"]
      overwatch: ["wingman[0]", "wingman[1]"]
    bound_distance: {parameter_ref: bound_distance}
    standoff_distance: {parameter_ref: standoff_distance}
    active_when: {condition_ref: in_contact}
    basis: {status: user_specified, confirmation: confirmed}
  - id: coord_contact_report
    pattern: report_and_wait
    reporter: wingman
    receiver: platoon_leader
    ack_timeout: {value: 30, unit: sec}
    basis: {status: user_specified, confirmation: confirmed}

messages: []

parameters:
  wedge_depth: {type: distance, value: 100, unit: m, minimum: 25, maximum: 500, description: 楔形纵深间隔（示例值）, basis: {status: user_specified, confirmation: confirmed}}
  wedge_half_width: {type: distance, value: 100, unit: m, minimum: 25, maximum: 500, description: 楔形横向半宽（示例值）, basis: {status: user_specified, confirmation: confirmed}}
  column_interval: {type: distance, value: 50, unit: m, minimum: 10, maximum: 300, description: 纵队车间距（示例值）, basis: {status: user_specified, confirmation: confirmed}}
  station_tolerance: {type: distance, value: 30, unit: m, description: 站位容差（示例值）, basis: {status: user_specified, confirmation: confirmed}}
  urban_transition_distance: {type: distance, value: 200, unit: m, description: 距城区多远开始转纵队（示例值）, basis: {status: user_specified, confirmation: confirmed}}
  contact_range: {type: distance, value: 1.5, unit: km, description: 视为接敌的距离（示例值）, basis: {status: user_specified, confirmation: confirmed}}
  contact_hold_time: {type: time, value: 2, unit: min, description: 失去接触后保持接敌状态的时间（示例值）, basis: {status: user_specified, confirmation: confirmed}}
  travel_speed_open: {type: speed, value: 30, unit: km/h, description: 开阔地行进速度（示例值）, basis: {status: user_specified, confirmation: confirmed}}
  travel_speed_urban: {type: speed, value: 15, unit: km/h, description: 城区行进速度（示例值）, basis: {status: user_specified, confirmation: confirmed}}
  bound_distance: {type: distance, value: 300, unit: m, description: 每次跃进距离（示例值）, basis: {status: user_specified, confirmation: confirmed}}
  standoff_distance: {type: distance, value: 800, unit: m, description: 交替跃进停止推进的对敌距离（示例值）, basis: {status: user_specified, confirmation: confirmed}}

resources: []

conditions:
  - id: in_contact
    description: 最近敌方目标进入接敌距离。
    expression:
      compare:
        left: {track_value: {property: nearest_hostile_range}}
        operator: lte
        right: {parameter_ref: contact_range}
  - id: entering_urban
    description: 前方城区地形已在转换距离内。
    expression:
      compare:
        left: {terrain_value: {property: distance_to_class, class: urban}}
        operator: lte
        right: {parameter_ref: urban_transition_distance}
  - id: leaving_urban
    description: 已离开城区且转换距离内不再有城区。
    expression:
      all:
        - not: {condition_ref: entering_urban}
        - compare:
            left: {terrain_value: class}
            operator: ne
            right: {literal: urban}
  - id: contact_cleared
    description: 接敌解除并保持一段时间。
    expression:
      all:
        - not: {condition_ref: in_contact}
        - function_call: {name: time_in_state_gte, arguments: {duration: {parameter_ref: contact_hold_time}}}
  - id: mover_ok
    description: 机动部件可用。
    expression: {mover_value: available}
  - id: contact_not_yet_reported
    description: 本次接敌尚未报告。
    expression: {not: {blackboard_value: mission.contact_reported}}

behaviors:
  - id: set_formation_wedge
    description: 选择楔形队形。
    actions:
      - {command: set_blackboard, arguments: {key: mission.current_formation, value: {literal: wedge}}}
    success: {expression: {literal: true}}
  - id: set_formation_column
    description: 选择纵队队形。
    actions:
      - {command: set_blackboard, arguments: {key: mission.current_formation, value: {literal: column}}}
    success: {expression: {literal: true}}
  - id: mark_contact_reported
    description: 记录本次接敌已报告，避免重复报告。
    actions:
      - {command: set_blackboard, arguments: {key: mission.contact_reported, value: {literal: true}}}
    success: {expression: {literal: true}}
  - id: clear_contact_reported
    description: 恢复行进时清除接敌报告标记。
    actions:
      - {command: set_blackboard, arguments: {key: mission.contact_reported, value: {literal: false}}}
    success: {expression: {literal: true}}
  - id: follow_route_open
    description: 以开阔地速度沿主路线行进。
    precondition: {condition_ref: mover_ok}
    claims: [movement_control]
    actions:
      - {command: follow_route, arguments: {route: main_route, speed: {parameter_ref: travel_speed_open}}, issue_policy: once_per_activation}
    success: {expression: {mover_value: route_complete}}
    failure: {expression: {not: {condition_ref: mover_ok}}}
  - id: follow_route_urban
    description: 以城区速度沿主路线行进。
    precondition: {condition_ref: mover_ok}
    claims: [movement_control]
    actions:
      - {command: follow_route, arguments: {route: main_route, speed: {parameter_ref: travel_speed_urban}}, issue_policy: once_per_activation}
    success: {expression: {mover_value: route_complete}}
    failure: {expression: {not: {condition_ref: mover_ok}}}

trees:
  - id: leader_open_tree
    root:
      node_id: leader_open_root
      type: sequence_with_memory
      children:
        - {node_id: leader_pick_wedge, type: behavior, behavior: set_formation_wedge}
        - {node_id: leader_announce_wedge, type: behavior, behavior: coord_leader_follower__announce_formation}
        - {node_id: leader_move_open, type: behavior, behavior: follow_route_open}
  - id: leader_urban_tree
    root:
      node_id: leader_urban_root
      type: sequence_with_memory
      children:
        - {node_id: leader_pick_column, type: behavior, behavior: set_formation_column}
        - {node_id: leader_announce_column, type: behavior, behavior: coord_leader_follower__announce_formation}
        - {node_id: leader_move_urban, type: behavior, behavior: follow_route_urban}
  - id: leader_contact_tree
    root:
      node_id: leader_contact_root
      type: selector
      children:
        - node_id: leader_ack_seq
          type: sequence
          children:
            - {node_id: leader_report_check, type: condition, condition: coord_contact_report__report_received}
            - {node_id: leader_ack, type: behavior, behavior: coord_contact_report__acknowledge}
        - {node_id: leader_bounding, type: subtree, tree: coord_bounding__tree}
  - id: wingman_travel_tree
    root:
      node_id: wingman_travel_root
      type: sequence_with_memory
      children:
        - {node_id: wingman_clear_report, type: behavior, behavior: clear_contact_reported}
        - {node_id: wingman_keep_station, type: behavior, behavior: coord_leader_follower__keep_station}
  - id: wingman_contact_tree
    root:
      node_id: wingman_contact_root
      type: selector
      children:
        - node_id: wingman_report_seq
          type: sequence
          children:
            - {node_id: wingman_report_check, type: condition, condition: contact_not_yet_reported}
            - {node_id: wingman_report, type: behavior, behavior: coord_contact_report__send_report}
            - {node_id: wingman_mark_reported, type: behavior, behavior: mark_contact_reported}
        - {node_id: wingman_bounding, type: subtree, tree: coord_bounding__tree}

tests:
  - id: leader_travels_in_wedge
    category: nominal
    given: {role: platoon_leader, state: travel_open}
    expect:
      next_state: travel_open
      fired_transition: open_self
      selected_path: [leader_open_root, leader_move_open]
      issued_actions: [send_message, follow_route]
      sent_messages: [coord_leader_follower__formation]
      blackboard: {mission.current_formation: wedge}
  - id: leader_switches_to_column_near_urban
    category: nominal
    given:
      role: platoon_leader
      state: travel_open
      terrain: {distance_to_class.urban: {value: 150, unit: m}}
    expect:
      next_state: travel_urban
      fired_transition: open_to_urban
      sent_messages: [coord_leader_follower__transition, coord_leader_follower__formation]
      blackboard: {mission.current_formation: column}
  - id: leader_returns_to_open
    category: nominal
    given:
      role: platoon_leader
      state: travel_urban
      terrain: {class: open}
    expect: {next_state: travel_open, fired_transition: urban_to_open}
  - id: leader_contact_preempts_urban_entry
    category: priority_transition
    given:
      role: platoon_leader
      state: travel_open
      terrain: {distance_to_class.urban: {value: 150, unit: m}}
      tracks: {nearest_hostile_range: {value: 1, unit: km}}
    expect:
      next_state: contact
      fired_transition: open_to_contact
      selected_path: [leader_contact_root, leader_bounding, coord_bounding__root, coord_bounding__bound_seq, coord_bounding__bound_node]
      issued_actions: [bound_to_position]
  - id: leader_contact_in_urban
    category: priority_transition
    given:
      role: platoon_leader
      state: travel_urban
      terrain: {class: urban, distance_to_class.urban: 0}
      tracks: {nearest_hostile_range: {value: 800, unit: m}}
    expect: {next_state: contact, fired_transition: urban_to_contact}
  - id: leader_leaves_contact_after_hold
    category: timeout_or_loss
    given:
      role: platoon_leader
      state: contact
      elapsed: {state: {value: 3, unit: min}}
    expect: {next_state: travel_open, fired_transition: contact_to_open}
  - id: leader_stays_in_contact_during_hold
    category: timeout_or_loss
    given:
      role: platoon_leader
      state: contact
      elapsed: {state: {value: 30, unit: sec}}
    expect: {next_state: contact, fired_transition: contact_self}
  - id: leader_cannot_move_without_mover
    category: resource_unavailable
    given:
      role: platoon_leader
      state: travel_open
      components: {mover.available: false}
    expect:
      next_state: travel_open
      tree_status: failure
      selected_path: [leader_open_root, leader_move_open]
  - id: leader_acknowledges_report
    category: nominal
    given:
      role: platoon_leader
      state: contact
      elapsed: {state: {value: 10, unit: sec}}
      tracks: {nearest_hostile_range: {value: 1, unit: km}}
      messages: [{message: coord_contact_report__report, fields: {contact_range: 1000.0, contact_count: 1}}]
    expect:
      next_state: contact
      selected_path: [leader_contact_root, leader_ack_seq, leader_ack]
      sent_messages: [coord_contact_report__ack]
  - id: wingman_keeps_station
    category: nominal
    given:
      role: wingman
      instance: 0
      state: travel_open
      messages: [{message: coord_leader_follower__formation, fields: {formation: wedge}}]
    expect:
      next_state: travel_open
      selected_path: [wingman_travel_root, wingman_keep_station]
      issued_actions: [keep_station]
  - id: wingman_follows_leader_transition
    category: nominal
    given:
      role: wingman
      instance: 1
      state: travel_open
      messages: [{message: coord_leader_follower__transition, fields: {to_state: travel_urban}}]
    expect: {next_state: travel_urban, fired_transition: coord_leader_follower__travel_open__to__travel_urban}
  - id: wingman_reports_contact
    category: priority_transition
    given:
      role: wingman
      instance: 0
      state: travel_open
      tracks: {nearest_hostile_range: {value: 1.2, unit: km}, hostile_count: 1}
    expect:
      next_state: contact
      fired_transition: wing_open_contact
      selected_path: [wingman_contact_root, wingman_report_seq, wingman_mark_reported]
      issued_actions: [report_contact]
      sent_messages: [coord_contact_report__report]
      blackboard: {mission.contact_reported: true}
  - id: wingman_urban_contact
    category: priority_transition
    given:
      role: wingman
      instance: 2
      state: travel_urban
      tracks: {nearest_hostile_range: {value: 500, unit: m}}
    expect: {next_state: contact, fired_transition: wing_urban_contact}
  - id: bounding_stops_at_standoff
    category: precondition_failure
    given:
      role: wingman
      instance: 2
      state: contact
      blackboard: {mission.contact_reported: true}
      tracks: {nearest_hostile_range: {value: 805, unit: m}}
    expect:
      next_state: contact
      selected_path: [wingman_contact_root, wingman_bounding, coord_bounding__root, coord_bounding__overwatch_node]
      issued_actions: [hold_overwatch_position]
  - id: overwatch_member_waits_its_turn
    category: precondition_failure
    given:
      role: wingman
      instance: 2
      state: contact
      tracks: {nearest_hostile_range: {value: 1, unit: km}}
      blackboard: {mission.contact_reported: true}
      coordination: {coord_bounding: {phase: 1}}
    expect:
      next_state: contact
      selected_path: [wingman_contact_root, wingman_bounding, coord_bounding__root, coord_bounding__overwatch_node]
      issued_actions: [hold_overwatch_position]

scenarios:
  - id: open_to_urban_transition
    description: 开阔地行进约 2 km 后接近城区，期望全排转为纵队并保持站位。
    environment:
      terrain:
        default_class: open
        regions:
          - {class: urban, x_min: 2500, x_max: 4000, y_min: -1500, y_max: 1500}
      routes:
        main_route: [[0, 0], [5000, 0]]
      duration: {value: 8, unit: min}
      random_seed: 42
    initial:
      platoon_leader: {position: [0, 0], heading_deg: 90, state: travel_open}
      wingman: {formation: wedge, state: travel_open}
    events:
      - {id: leader_near_urban, type: marker, when: {role: platoon_leader, x_gte: 2300}}
    expect:
      - id: e_followers_switch
        observable: role_state
        role: wingman
        equals: travel_urban
        within: {after_event: leader_near_urban, value: 30, unit: sec}
      - id: e_wedge_kept
        observable: formation_error_rms
        formation: wedge
        lte: {parameter_ref: station_tolerance}
        during: {from: start, duration: {value: 150, unit: sec}}
      - id: e_column_kept
        observable: formation_error_rms
        formation: column
        lte: {parameter_ref: station_tolerance}
        during: {from: e_followers_switch, duration: {value: 120, unit: sec}}
      - id: e_no_collisions
        observable: min_interval
        role: wingman
        gte: {value: 10, unit: m}
    traces_to: [open_to_urban, coord_leader_follower, wedge, column]

  - id: contact_bounding_overwatch
    description: 开阔地遭遇敌方，期望报告接敌、全排转入接敌状态并交替跃进。
    environment:
      routes:
        main_route: [[0, 0], [6000, 0]]
      duration: {value: 10, unit: min}
      random_seed: 7
    initial:
      platoon_leader: {position: [0, 0], heading_deg: 90, state: travel_open}
      wingman: {formation: wedge, state: travel_open}
    events:
      - {id: hostile_appears, type: spawn_hostile, at: {value: 60, unit: sec}, position: [2600, 300]}
    expect:
      - id: e_leader_contact
        observable: role_state
        role: platoon_leader
        equals: contact
        within: {after_event: hostile_appears, value: 120, unit: sec}
      - id: e_wingmen_contact
        observable: role_state
        role: wingman
        equals: contact
        within: {after_event: hostile_appears, value: 150, unit: sec}
      - id: e_report_sent
        observable: messages_sent
        message: coord_contact_report__report
        gte: 1
      - id: e_report_not_repeated
        observable: messages_sent
        message: coord_contact_report__report
        lte: 3
      - id: e_bounds_alternate
        observable: messages_sent
        message: coord_bounding__bound_complete
        gte: 4
      - id: e_wingmen_bound
        observable: actions_issued
        role: wingman
        command: bound_to_position
        gte: 2
      # standoff_distance 800 m minus 25 m allowance for braking and the 1 s decision step
      - id: e_standoff_kept
        observable: hostile_range_min
        gte: {value: 775, unit: m}
    traces_to: [open_to_contact, coord_bounding, coord_contact_report]

  - id: partial_comm_loss_transition
    description: 通信丢包 50% 时长车转纵队，依靠周期性重发，僚车仍应在进入城区前完成同步。
    environment:
      terrain:
        default_class: open
        regions:
          - {class: urban, x_min: 2500, x_max: 4000, y_min: -1500, y_max: 1500}
      routes:
        main_route: [[0, 0], [5000, 0]]
      duration: {value: 8, unit: min}
      random_seed: 11
    initial:
      platoon_leader: {position: [0, 0], heading_deg: 90, state: travel_open}
      wingman: {formation: wedge, state: travel_open}
    events:
      - {id: lossy_net, type: comm_degradation, at: {value: 0, unit: sec}, duration: {value: 8, unit: min}, loss: 0.5}
      - {id: leader_near_urban, type: marker, when: {role: platoon_leader, x_gte: 2300}}
    expect:
      - id: e_followers_switch_lossy
        observable: role_state
        role: wingman
        equals: travel_urban
        within: {after_event: leader_near_urban, value: 45, unit: sec}
      - id: e_column_kept_lossy
        observable: formation_error_rms
        formation: column
        lte: {parameter_ref: station_tolerance}
        during: {from: e_followers_switch_lossy, duration: {value: 120, unit: sec}}
    traces_to: [open_to_urban, coord_leader_follower, column]

  - id: comm_loss_during_transition
    description: 通信完全中断时长车转纵队，僚车收不到同步消息，应保持原状态与安全间距。
    environment:
      terrain:
        default_class: open
        regions:
          - {class: urban, x_min: 2500, x_max: 4000, y_min: -1500, y_max: 1500}
      routes:
        main_route: [[0, 0], [5000, 0]]
      duration: {value: 6, unit: min}
      random_seed: 3
    initial:
      platoon_leader: {position: [0, 0], heading_deg: 90, state: travel_open}
      wingman: {formation: wedge, state: travel_open}
    events:
      - {id: jam, type: comm_degradation, at: {value: 0, unit: sec}, duration: {value: 6, unit: min}, loss: 1.0}
    expect:
      - id: e_leader_switches
        observable: role_state
        role: platoon_leader
        equals: travel_urban
        within: {after_event: jam, value: 6, unit: min}
      - id: e_wingmen_stay
        observable: role_state
        role: wingman
        equals: travel_open
        during: {from: start, duration: {value: 6, unit: min}}
      - id: e_transition_attempted
        observable: messages_sent
        message: coord_leader_follower__transition
        gte: 1
      - id: e_spacing_safe
        observable: min_interval
        role: wingman
        gte: {value: 10, unit: m}
    traces_to: [open_to_urban, coord_leader_follower]
