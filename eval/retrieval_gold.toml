# Retrieval evaluation gold set — DRAFT, needs your review.
#
# Each case is a typical tactical requirement plus the sources a competent
# analyst would expect a literature search to surface. The harness checks
# whether Crow discovers, keeps (after screening) and accepts them.
#
# match kinds (first that applies is used; several may be given):
#   doi           exact DOI (case-insensitive)
#   arxiv         arXiv identifier without version
#   designation   doctrine designation found in title or URL, e.g. "ATP 3-20.15"
#   title         title similarity >= 0.85 after normalization
#   url_contains  substring of the candidate URL
#
# importance: "must" (a search that misses it is clearly inadequate) or
#             "should" (strong expected source).
# verified:   true when the reference itself was confirmed to exist (Crossref
#             record, publisher page or official index); review the rest.
#
# Please review: delete gold entries you disagree with, add the papers you
# consider canonical, add Chinese requirements and CNKI sources (match by
# title) once your library is populated, then set status = "reviewed".

version = "2026-10-12-draft"
status = "draft"

