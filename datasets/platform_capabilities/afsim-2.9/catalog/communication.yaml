  description: 规定网内成员之间的链接方式：星形、全互联、环形、点对点或自定义。
  natural_language:
    definition: 按拓扑类型自动建立网内链接：星形（只与中心相连，任意两成员最多两跳）、全互联（两两双向）、按通信能力建立的全互联（仅在建网时能互通的成员之间建链，默认）、点对点（恰好两个成员）、环形（与相邻成员双向，至少三个成员）、单向环、或逐条指定的自定义链接。
