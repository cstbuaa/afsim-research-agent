    expected_result: 消息的实际发出时间和是否被丢弃受队列规则约束。
    boundaries:
    - 默认 1 个信道、先进先出、队列无上限、不清除、不重传。
    - 清除时间短于重传间隔时，消息可能在重传前就被清除。
