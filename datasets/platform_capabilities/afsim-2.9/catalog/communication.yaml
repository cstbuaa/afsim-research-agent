  kind: comm
  description: 设备同时能发几条消息、待发消息如何排队、队满或超时如何丢弃、失败后重传几次。
  natural_language:
    definition: 设备有若干发送信道；超出的消息进入队列，按先进先出、后进先出或优先级出队；队列满时后到的消息被丢弃，超过保留时间的消息被清除，发送失败可按次数和间隔重传。
