format: PlatformCapabilityCatalogPart
format_version: 0.3.0
catalog:
  id: afsim_2_9_capabilities
  platform_family: afsim
  platform_version: '2.9'
  language: zh-CN
  classification: public
  updated_on: '2026-10-16'
part:
  domain: communication
  display_name: 通信类
  summary: 平台之间如何收发消息、谁能和谁通信、通信何时中断或受干扰、传输有多快。
  subcategories:
  - id: messaging
    display_name: 消息收发
    summary: 发送、接收、定址、群发消息，以及带确认的报告；行为之间协同的基本手段。
  - id: reporting
    display_name: 情报与航迹上报
    summary: 把已有的目标航迹报告给上级或友邻。
  - id: link_state
    display_name: 链路与设备状态
    summary: 通信是否可用、设备开关与无线电静默、受干扰感知、备用频率切换、通信中断判定。
  - id: network
    display_name: 网络组织与路由
    summary: 谁和谁在同一个网里、网络拓扑（星形、网状、环形等）、随距离变化的动态组网、消息路由。
  - id: transmission
    display_name: 传输性能
    summary: 发送队列、优先级与重传，传播时延与速率，共享信道的竞争与传输模式。
  - id: device_type
    display_name: 通信设备类型
    summary: 有线、无线电、时分数据链、水下、激光等设备的特性与边界。
  - id: fidelity_selection
    display_name: 保真度选择
    summary: 按保真度在多个通信模型之间选择。
conventions:
  status: capability/provides/accepts 状态：available | partial | unavailable | unknown；partial = 来源有说明但接口参数或运行验证未完成；unknown
    = 推断存在但来源未给出接口。
  ir_v1: 对应 IR 1.0 的动作或操作数；null 表示 IR 1.0 无对应项（ir_gap）。
  kind: comm = 通信设备提供；network = 网络配置；processor = 由处理组件提供；composite = 由其他能力组合实现（见 composed_of）。
  replaces: 记录从 0.2.0 目录迁移的条目。
capabilities:
- id: message_exchange
  display_name: 类型化消息交换
  aliases: []
  domain: communication
  subcategory: messaging
  kind: comm
  description: 发送和接收保留类型、消息身份与端点身份的消息。
  natural_language:
    definition: 发送和接收保留类型、消息身份与端点身份的消息。
    use_when: 行为需要交换状态、控制或业务内容并按类型处理时。
    expected_result: 收到时能分辨消息类型，发送请求可明确内容和收发接口。
    boundaries:
    - 交换描述消息内容与交付事件，传输可用性由通信链路另行表示。
    - 消息已发送、已接收和业务任务已接受是三个不同事实。
    - 发送端须指定发送用的通信设备；接收按消息类型分派到相应处理。
    requirement_example: 通过指定收发接口发送状态消息，接收后按类型分派处理。
  tactical_uses:
  - 通报队形或阶段转换
  - 跃进完成通报
  - 下达或转发命令
  - 同步状态转换
  keywords:
  - 消息
  - 发送
  - 接收
  - 通报
  - 广播
  - message
  - send
  - receive
  - notify
  applicable_platform_classes: &id001
  - air_vehicle
  - ground_vehicle
  - surface_vessel
  - subsurface_vehicle
  - space_vehicle
  - static_node
  - weapon_platform
  status: partial
  maturity: draft
  ir_v1:
  - send_message
  - message_received
  provides:
  - ir: communication_message.received_type
    display_name: 已接收消息类型
    value_type: string
    cardinality: collection
    key: message_id
    item_scope: per_message
    freshness: event
    status: partial
    ir_v1: message_received
    note: IR 1.0 以 message_received(消息) 判断是否收到某类消息。
  accepts:
  - ir: communication_action.send_message
    display_name: 发送类型化消息
    status: unknown
    ir_v1: send_message
    parameters: &id002
    - name: message_reference
      type: string
      required: true
    - name: message_type
      type: string
      required: true
    - name: payload
      type: string
      required: true
    - name: sender_interface
      type: string
      required: true
    - name: receiver_interface
      type: string
      required: true
    result:
      type: command_status
      values: &id003
      - accepted
      - rejected
      status: unknown
    side_effects:
    - 可能占用发送资源并触发消息发送及后续接收事件；不保证送达或业务执行。
  settings: []
  dependencies:
  - data_link_communication
  constraints:
  - 端点必须唯一识别通信设备，不能只给平台名称。
  - 消息标识必须在发送者与接收者之间可关联，业务内容由相应类型解释。
  limitations:
  - 通用发送方法及其重载未在所读页确认，发送动作绑定未知。
  - 接收回调只证明送达当前处理器，不证明业务执行成功或必定送达。
  source_gaps:
  - 通信组件与消息对象的运行时脚本接口参考（发送方法、参数、返回值、状态读取）
  binding: local
- id: point_to_point_communication
  display_name: 定址通信
  aliases: []
  domain: communication
  subcategory: messaging
  kind: comm
  description: 向明确的单一接收通信接口发送类型化消息。
  natural_language:
    definition: 向明确的单一接收通信接口发送类型化消息。
    use_when: 行为需要指定唯一收件设备而非广播或关系接收者集合时。
    expected_result: 每个发送请求保留唯一目的接口，并可关联消息身份。
    boundaries:
    - 定址单播是一种行为语义，不限定网络拓扑只能有两个成员。
    - 定址消息仍可能经过多跳路由。
    requirement_example: 向目标平台上的指定接收设备发送一条任务状态消息。
  tactical_uses:
  - 向排长单独报告
  - 向指定车辆下达命令
  keywords:
  - 定址
  - 单播
  - 点对点
  - 指定接收者
  - unicast
  - addressed
  - point to point
  applicable_platform_classes: *id001
  status: partial
  maturity: draft
  ir_v1:
  - send_message
  provides:
  - ir: communication_link.addressed_destination
    display_name: 定址消息目的接口
    value_type: string
    cardinality: collection
    key: message_id
    item_scope: per_message
    freshness: dynamic
    status: unknown
    ir_v1: null
  accepts:
  - ir: communication_action.send_addressed_message
    display_name: 发送定址消息
    status: unknown
    ir_v1: send_message
    parameters: *id002
    result:
      type: command_status
      values: *id003
      status: unknown
    side_effects:
    - 可能占用源接口的发送资源并触发指定目的接口的接收事件；不保证送达或业务执行。
    note: IR 1.0 的 send_message 由消息声明给出接收者；单一接收者即定址发送。
  settings: []
  dependencies:
  - message_exchange
  constraints:
  - 必须提供源接口和目的接口的唯一标识，并存在有效通信路径。
  limitations:
  - 仅声明定址通信，不从点对点网络模型推导专用连接或安全保证。
  - 外部链接配置已证实，但任意消息的运行时发送重载及目的接口读取仍未知。
  source_gaps:
  - 通信组件与消息对象的运行时脚本接口参考（发送方法、参数、返回值、状态读取）
  binding: local
- id: group_messaging
  display_name: 群组通信
  aliases: []
  domain: communication
  subcategory: messaging
  kind: comm
  description: 向一个群组地址发送消息，群组内成员都能收到，减少逐一发送的消息数量。
  natural_language:
    definition: 设备加入一个或多个群组；发往群组地址的消息被投递给群组内所有成员。
    use_when: 需要同时通知多个成员（全排、全连）而不逐一定址时。
    expected_result: 一次发送，群组内具备群组收发能力的成员都收到。
    boundaries:
    - 发送者、接收者以及中间转发的设备都须具备群组收发能力，否则消息被丢弃。
    - 群组能力本身不选择路径，须与常规路由一同使用。
    - 设备能力分三级：不支持、只能发送、可收可发（默认）。
    - 来源说明运行中加入和离开群组的接口为计划功能，目前群组成员关系在想定配置时确定。
    requirement_example: 排长向全排群组通报转入攻击阶段，各车同时收到。
  tactical_uses:
  - 全排通报
  - 全连广播
  - 同时下达阶段转换
  keywords:
  - 群组
  - 组播
  - 广播
  - 全排
  - multicast
  - group
  - broadcast
  applicable_platform_classes: *id001
  status: partial
  maturity: draft
  ir_v1:
  - send_message
  provides: []
  accepts:
  - ir: communication_action.send_group_message
    display_name: 向群组发送消息
    status: unknown
    ir_v1: send_message
    parameters:
    - name: message_reference
      type: string
      required: true
    - name: message_type
      type: string
      required: true
    - name: payload
      type: string
      required: true
    - name: sender_interface
      type: string
      required: true
    - name: group
      type: string
      required: true
    result:
      type: command_status
      values: *id003
      status: unknown
    side_effects:
    - 向群组内所有可达成员投递；不保证每个成员都收到。
  - ir: communication_action.join_group
    display_name: 运行中加入群组
    status: unknown
    ir_v1: null
    parameters:
    - name: interface
      type: string
      required: true
    - name: group
      type: string
      required: true
    result:
      type: command_status
      values: *id003
      status: unknown
    side_effects:
    - 经过加入时延后开始接收该群组消息。
    note: 来源称运行中加入/离开为计划功能。
  - ir: communication_action.leave_group
    display_name: 运行中离开群组
    status: unknown
    ir_v1: null
    parameters:
    - name: interface
      type: string
      required: true
    - name: group
      type: string
      required: true
    result:
      type: command_status
      values: *id003
      status: unknown
    side_effects:
    - 经过离开时延后不再接收该群组消息。
    note: 来源称运行中加入/离开为计划功能。
  settings:
  - name: group_membership
    display_name: 初始加入的群组
    type: list
    required: false
    sensitivity: model_characteristic
  - name: group_capability_level
    display_name: 群组收发能力
    type: enumeration
    values:
    - none
    - send_only
    - send_and_receive
    default: send_and_receive
    required: false
    sensitivity: model_characteristic
  - name: group_join_delay
    display_name: 加入群组时延
    type: duration
    unit: s
    default: 0
    required: false
    sensitivity: model_characteristic
  - name: group_leave_delay
    display_name: 离开群组时延
    type: duration
    unit: s
    default: 0
    required: false
    sensitivity: model_characteristic
  dependencies:
  - message_exchange
  - network_routing
  constraints:
  - 群组地址须在保留的群组地址段内。
  - 路径上的转发设备也须具备群组能力。
  limitations:
  - 默认不启用群组协议，须在设备上显式配置。
  - 运行中加入/离开群组不可用（来源称为计划功能）。
  source_gaps:
  - 通信组件与消息对象的运行时脚本接口参考（发送方法、参数、返回值、状态读取）
  binding: local
- id: acknowledged_messaging
  display_name: 带确认的报告
  aliases: []
  domain: communication
  subcategory: messaging
  kind: composite
  description: 发送报告后等待接收方确认，超时未确认则重发或按预案处理。
  natural_language:
    definition: 发送一条报告，等待接收方回复确认消息；在规定时间内收到确认即完成，否则视为未送达。
    use_when: 报告必须被上级知悉（接敌报告、跃进完成、请求火力）而通信可能不可靠时。
    expected_result: 报告方得到“已确认”或“超时”两种结果之一，可据此重发或改用其他手段。
    boundaries:
    - 确认只表示接收方收到消息，不表示接收方接受或执行。
    - 确认消息本身也可能丢失，超时不等于对方未收到。
    - 设备层的自动重传与本能力的确认是两回事。
    requirement_example: 僚车跃进到位后向排长报告“到位”，5 秒内未收到确认则再报一次，两次无确认转为自主掩护。
  tactical_uses:
  - 接敌报告
  - 跃进到位报告
  - 请求火力
  - 通信不可靠时确保送达
  keywords:
  - 确认
  - 应答
  - 回执
  - 超时
  - 重发
  - acknowledge
  - ack
  - timeout
  - report
  applicable_platform_classes: *id001
  status: partial
  maturity: draft
  provides: []
  accepts: []
  settings:
  - name: ack_timeout
    display_name: 确认等待时间
    type: duration
    unit: s
    required: false
    sensitivity: model_characteristic
  - name: max_report_attempts
    display_name: 最多报告次数
    type: count
    unit: count
    required: false
    sensitivity: model_characteristic
  dependencies:
  - message_exchange
  - point_to_point_communication
  composed_of:
  - capability: message_exchange
    role: 发送报告与确认消息
  - capability: point_to_point_communication
    role: 向指定接收者报告
  constraints:
  - 报告与确认须能用消息身份对应起来。
  limitations:
  - 没有原生的确认机制，由行为层组合实现；组合方式尚未运行验证。
  binding: local
- id: track_reporting
  display_name: 航迹报告传播
  aliases: []
  domain: communication
  subcategory: reporting
  kind: processor
  description: 向指定接收者传播已有航迹报告并保留航迹与报告来源。
  natural_language:
    definition: 向指定接收者传播已有航迹报告并保留航迹与报告来源。
    use_when: 行为需要向协同节点共享已知目标信息时。
    expected_result: 接收方获得可关联航迹身份的报告事件。
    boundaries:
    - 报告传播不创建测量、不关联或融合航迹。
    - 本地状态通知和跨平台航迹报告不是同一种消息。
    - 按周期配置的上报不是“立即上报”动作；立即上报一个接触须经消息发送组合实现。
    requirement_example: 把本地允许报告的目标航迹经指定接口上报，区分原始和融合来源。
  tactical_uses:
  - 向排长报告发现敌车辆
  - 逐级上报敌情
  - 友邻间共享目标
  keywords:
  - 接触报告
  - 敌情
  - 航迹
  - 上报
  - 目标共享
  - contact report
  - track report
  applicable_platform_classes: *id001
  status: partial
  maturity: draft
  ir_v1:
  - report_contact
  provides:
  - ir: track_report.reported_track
    display_name: 报告携带的航迹引用
    value_type: track_reference
    cardinality: per_track
    key: track_id
    freshness: event
    status: partial
    metadata:
    - message_id
    - source_interface
    - destination_interface
    - report_kind
    ir_v1: null
  accepts:
  - ir: communication_action.report_contact
    display_name: 立即上报接触
    status: unknown
    ir_v1: report_contact
    parameters:
    - name: track_reference
      type: track_reference
      required: true
    - name: receiver_interface
      type: string
      required: true
    result:
      type: command_status
      values: *id003
      status: unknown
    side_effects:
    - 向接收者发送一条带航迹的报告；不保证送达。
    note: 来源中没有通用的立即上报动作；可由消息发送携带航迹字段实现。
  settings:
  - name: report_period
    display_name: 航迹报告间隔
    type: duration
    required: false
    sensitivity: public_generic
    unit: s
  - name: report_kind
    display_name: 报告数据类别
    type: enumeration
    required: false
    sensitivity: public_generic
    values:
    - raw
    - fused
  dependencies:
  - message_exchange
  constraints:
  - 须有已有航迹、报告选择条件和可用的外部通信链接。
  limitations:
  - 配置报告不等于每条报告可靠送达，接收事件需另行观察。
  - 融合报告须避免返回源节点而形成循环；无通用强制立即报告动作。
  source_gaps:
  - 通信组件与消息对象的运行时脚本接口参考（发送方法、参数、返回值、状态读取）
  binding: local
- id: data_link_communication
  display_name: 数据链路通信
  aliases: []
  domain: communication
  subcategory: link_state
  kind: comm
  description: 表示指定通信接口之间承载数据消息的传输可用性。
  natural_language:
    definition: 表示指定通信接口之间承载数据消息的传输可用性。
    use_when: 行为需要判断是否具有支持消息交换的通信条件时。
    expected_result: 得到带收发接口身份的传输可用性要求，并显式保留未知状态。
    boundaries:
    - 链路只承载消息，不定义消息内容、任务结果或命令权限。
    - 物理链路存在不等于接收设备兼容或消息可靠送达。
    requirement_example: 检查指定数据链路的传输条件，再请求发送报告。
  tactical_uses:
  - 发送前检查能否通信
  - 失联后改按预案行动
  - 选择可用的通信设备
  keywords:
  - 链路
  - 通信可用
  - 能否通信
  - 失联
  - link
  - available
  - connectivity
  applicable_platform_classes: *id001
  status: partial
  maturity: draft
  ir_v1:
  - comm_value.available
  provides:
  - ir: communication_link.transport_available
    display_name: 端点间传输可用性
    value_type: boolean
    cardinality: collection
    key: link_endpoint_pair_id
    item_scope: per_link
    freshness: dynamic
    status: unknown
    ir_v1: comm_value.available
    note: IR 1.0 的 comm_value.available 是设备级可用，不区分对端。
  accepts: []
  settings: []
  dependencies: []
  constraints:
  - 收发方向、接口能力、链路与路由及共享媒介约束均须满足。
  limitations:
  - 所读页未确认统一链路可用性查询，不能将配置或真实网络图直接当作行为感知。
  - 专用时分终端仅模拟物理传输，不意味着实现所有战术消息或加解密。
  source_gaps:
  - 通信组件与消息对象的运行时脚本接口参考（发送方法、参数、返回值、状态读取）
  replaces:
  - data_link_communication.settings[propagation_speed] → transmission_performance
  - data_link_communication.settings[channel_count] → transmission_queueing
  binding: local
- id: comm_device_control
  display_name: 通信设备开关与无线电静默
  aliases: []
  domain: communication
  subcategory: link_state
  kind: comm
  description: 开启或关闭指定通信设备，并设定设备只在发送时辐射还是持续辐射。
  natural_language:
    definition: 按设备开启或关闭通信设备；关闭期间不收不发。辐射方式分为“只在发送时辐射”和“开机即持续辐射”。
    use_when: 需要无线电静默、隐蔽接近、或在接敌后恢复通信时。
    expected_result: 指定设备进入开或关状态，行为可读取其开关状态。
