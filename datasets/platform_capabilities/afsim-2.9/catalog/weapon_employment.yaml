format: PlatformCapabilityCatalogPart
format_version: 0.3.0
catalog:
  id: afsim_2_9_capabilities
  platform_family: afsim
  platform_version: '2.9'
  language: zh-CN
  classification: public
  updated_on: '2026-10-16'
part:
  domain: weapon_employment
  display_name: 武器类
  summary: 平台用什么武器、何时能打、怎么开火、打了以后造成什么毁伤、如何对抗来袭武器。
  subcategories:
  - id: engagement_control
    display_name: 交战控制
    summary: 选择武器、开火（直射、制导、齐射）、停火、间接火力射击、武器开关。
  - id: readiness_inventory
    display_name: 武器状态与弹药
    summary: 武器是否就绪、剩余弹药、补装与冷却。
  - id: engagement_assessment
    display_name: 交战评估
    summary: 发射前判断是否在包线内、预测拦截时间；发射后观察命中、未命中、终止。
  - id: damage_effects
    display_name: 毁伤效果
    summary: 弹药对目标造成什么毁伤：爆炸半径、概率表、机动/火力/摧毁杀伤、激光能量。
  - id: countermeasure
    display_name: 对抗措施
    summary: 释放箔条等自卫对抗措施，以及对抗措施对来袭武器的削弱。
  - id: weapon_type
    display_name: 武器类型
    summary: 独立飞行弹药、直接作用武器、高能激光、射频干扰器、子对象武器的特性与边界。
  - id: launch_computation
    display_name: 发射计算
    summary: 各类发射计算模型及离线生成发射包线数据的工具。
conventions:
  status: capability/provides/accepts 状态：available | partial | unavailable | unknown；partial = 来源有说明但接口参数或运行验证未完成；unknown
    = 推断存在但来源未给出接口。
  ir_v1: 对应 IR 1.0 的动作、操作数或函数；null 表示 IR 1.0 无对应项（ir_gap）。
  kind: weapon = 武器组件提供；effect = 毁伤模型（想定配置）；state = 状态读取；composite = 由其他能力组合；tool = 离线工具。
  replaces: 记录从 0.2.0 目录迁移或改名的条目。
capabilities:
- id: weapon_selection
  display_name: 武器选择
  aliases: []
  domain: weapon_employment
  subcategory: engagement_control
  kind: weapon
  description: 为目标和交战上下文确定具体武器资源，保留资源身份供后续评估或释放使用。
  natural_language:
    definition: 为目标和交战上下文确定具体武器资源，保留资源身份供后续评估或释放使用。
    use_when: 行为需要从本平台多个武器中选择指定资源或比较候选资源时。
    expected_result: 获得所选武器引用，选择失败或资源不可用时不伪造有效引用。
    boundaries:
    - 选择武器不发射，也不代表获得交战许可。
    - 具名资源选择与基于评分的自动最优选择不同，后者的最终查询尚未确认。
    requirement_example: 按目标需要选定一个具名武器，再分别检查包线、库存及交战许可。
  tactical_uses:
  - 主炮/机枪/反坦克导弹的选择
  - 按目标类型选弹
  - 节约高价值弹药
  keywords:
  - 选择武器
  - 选弹
  - 主炮
  - 机枪
  - 导弹
  - weapon selection
  - select weapon
  applicable_platform_classes: &id001
  - air_vehicle
  - ground_vehicle
  - surface_vessel
  - subsurface_vehicle
  - space_vehicle
  - static_node
  - weapon_platform
  status: partial
  maturity: draft
  provides:
  - ir: weapon_selection.selected_weapon
    display_name: 选定武器资源
    value_type: weapon_reference
    cardinality: collection
    key: selection_context_id
    freshness: dynamic
    status: partial
    item_scope: per_selection_context
    metadata:
    - target
    - weapon_owner
    ir_v1: null
  accepts: []
  settings: []
  dependencies: []
  constraints:
  - 选择上下文须明确目标与武器所属平台，不能以武器类型代替具体资源身份。
  limitations:
  - 已确认具名资源获取与运行期武器目标配对，未确认通用最优武器选择查询或统一评分接口。
  source_gaps:
  - 武器、发射计算机的运行时脚本接口参考（开火、停火、状态与库存读取的方法、参数、返回值）
  binding: local
- id: weapon_launch
  display_name: 武器释放与发射
  aliases: []
  domain: weapon_employment
  subcategory: engagement_control
  kind: weapon
  description: 向指定武器资源提交针对目标的通用释放或发射请求。
  natural_language:
    definition: 向指定武器资源提交针对目标的通用释放或发射请求。
    use_when: 行为已决定使用武器，需要提交一轮或多轮释放请求时。
    expected_result: 对目标和武器保留发射请求，实际释放及后续效果通过独立事件确认。
    boundaries:
    - 通用发射不自动承诺直射模型或发射后制导。
    - 请求排队成功不等于已经离架，也不等于命中或毁伤。
    - 射击请求可设首发延迟、轮间隔和请求之间的最小间隔；同时进行的请求数有上限（默认 1）。
    - 没有目标航迹或航迹信息不足时，可按假定距离和高度推算目标位置射击。
    requirement_example: 向选定武器提交两轮目标发射请求，并单独等待实际释放事件。
  tactical_uses:
  - 齐射
  - 按轮次射击
  - 对区域盲射
  keywords:
  - 开火
  - 发射
  - 齐射
  - 射击
  - fire
  - launch
  - salvo
  applicable_platform_classes: *id001
  status: partial
  maturity: draft
  ir_v1:
  - fire_weapon
  provides: []
  accepts:
  - ir: weapon_action.launch
    display_name: 提交武器释放请求
    status: partial
    parameters:
    - name: weapon
      type: weapon_reference
      required: true
    - name: target
      type: track_reference
      required: true
    - name: round_count
      type: count
      required: true
      unit: count
    result:
      type: command_status
      values:
      - accepted
      - rejected
      status: unknown
    side_effects:
    - 请求可能进入释放调度；实际释放可消耗所选资源的弹药并创建飞行武器，后续效果须独立观察。
    ir_v1: fire_weapon
  settings:
  - name: first_round_delay
    display_name: 首次释放等待时间
    type: duration
    required: false
    sensitivity: model_characteristic
    unit: s
  - name: round_interval
    display_name: 齐射轮次间隔
    type: duration
    required: false
    sensitivity: model_characteristic
    unit: s
  - name: max_concurrent_requests
    display_name: 并发发射请求上限
    type: count
    required: false
    sensitivity: model_characteristic
    unit: count
  - name: reengage_interval
    display_name: 两次射击请求之间的最小间隔
    type: duration
    unit: s
    default: 0
    required: false
    sensitivity: model_characteristic
  - name: assumed_target_range
    display_name: 无目标航迹时的假定射击距离
    type: distance
    unit: m
    required: false
    sensitivity: model_characteristic
  - name: assumed_target_height
    display_name: 无目标航迹时的假定目标高度
    type: distance
    unit: m
    default: 1
    required: false
    sensitivity: model_characteristic
  dependencies:
  - weapon_selection
  - command_authority
  constraints:
  - 目标航迹和武器引用必须有效，轮数为正；资源可用性、库存、并发限制与重装限制必须满足。
  - 外部武器服务部署须保持分配后的武器身份且确认资源已就绪。
  limitations:
  - 提交的齐射请求可延迟执行；通用原生返回到抽象命令状态的完整映射尚未确认。
  source_gaps:
  - 武器、发射计算机的运行时脚本接口参考（开火、停火、状态与库存读取的方法、参数、返回值）
  replaces:
  - 设置 首次释放等待时间 改用中立名 first_round_delay
  - 设置 齐射轮次间隔 改用中立名 round_interval
  - 设置 并发发射请求上限 改用中立名 max_concurrent_requests
  binding: local
- id: direct_fire_engagement
  display_name: 指定目标直接开火
  aliases: []
  domain: weapon_employment
  subcategory: engagement_control
  kind: weapon
  description: 使用直接瞄准的武器资源，对指定目标提交带数量的开火请求。
  natural_language:
    definition: 使用直接瞄准的武器资源，对指定目标提交带数量的开火请求。
    use_when: 行为需要以直射弹药或持续照射方式对明确目标开火时。
    expected_result: 获得指定武器、目标与请求数量关联的接受或拒绝结果，实际射击及效果分别观察。
    boundaries:
    - 直接开火描述瞄准运用方式，不以是否创建独立弹药平台区分；请求接受不证明已发射、命中或毁伤。
    - 通用释放请求不承诺直射运用；本能力不承诺发射后制导，也不覆盖间接火力。
    - 持续照射的请求数量不等于照射时长或热容量，资源必须明确支持该数量契约。
    requirement_example: 对指定航迹请求一批直射弹药，使用请求结果决定后续行为，再观察交战事件。
  tactical_uses:
  - 主炮直瞄射击
  - 机枪压制
  - 对指定目标开火
  keywords:
  - 直瞄
  - 直射
  - 开火
  - 主炮
  - 机枪
  - direct fire
  - gun
  - engage
  applicable_platform_classes: *id001
  status: partial
  maturity: draft
  ir_v1:
  - fire_weapon
  provides: []
  accepts:
  - ir: weapon_action.direct_fire
    display_name: 对指定目标直接开火
    status: partial
    parameters:
    - name: weapon
      type: weapon_reference
      required: true
    - name: target
      type: track_reference
      required: true
    - name: round_count
      type: count
      required: true
      unit: count
    result:
      type: command_status
      values:
      - accepted
      - rejected
      status: unknown
    side_effects:
    - 实际开火可能消耗弹药或照射资源并对目标产生效果；请求数量、接受结果和模型效果须分别确认。
    ir_v1: fire_weapon
  settings: []
  dependencies:
  - weapon_selection
  - command_authority
  constraints:
  - 武器必须支持指定目标直射运用，目标须可定位且瞄准、遮挡和资源约束满足；请求数量须为正且不超过该资源可用量。
  limitations:
  - 弹道飞行、持续照射及冷却由具体武器模型处理；请求数量不保证实际射击数量。
  - 直接开火重载、任务相关性与原生返回需逐武器确认，不把任务请求接口冒充统一武器方法。
  source_gaps:
  - 武器、发射计算机的运行时脚本接口参考（开火、停火、状态与库存读取的方法、参数、返回值）
  binding: local
- id: guided_weapon_engagement
  display_name: 制导武器交战
  aliases: []
  domain: weapon_employment
  subcategory: engagement_control
  kind: weapon
  description: 向具体武器提交目标发射请求，并通过发射后的目标信息和制导组件维持交战。
  natural_language:
    definition: 向具体武器提交目标发射请求，并通过发射后的目标信息和制导组件维持交战。
    use_when: 行为使用需要目标航迹、上行更新或终端导引的飞行武器时。
    expected_result: 发射请求与目标、资源关联，后续依赖的目标更新和制导来源明确。
    boundaries:
    - 发射后制导依赖区别于通用释放请求；不保证命中。
    - 感知目标、预测拦截点和特许真实目标数据必须区分。
    requirement_example: 向有效三维航迹发射制导武器，在需要时保持外部目标更新并在丢失更新后按滑行策略处理。
  tactical_uses:
  - 反坦克导弹攻击
  - 防空导弹拦截
  - 制导炸弹投放
  keywords:
  - 导弹
  - 制导
  - 反坦克导弹
  - 发射后制导
  - guided
  - missile
  - atgm
  applicable_platform_classes: *id001
  status: partial
  maturity: draft
  ir_v1:
  - fire_weapon
  provides: []
  accepts:
  - ir: weapon_action.guided_engagement
    display_name: 提交制导武器交战
    status: partial
    parameters:
    - name: weapon
      type: weapon_reference
      required: true
    - name: target
      type: track_reference
      required: true
    - name: round_count
      type: count
      required: true
      unit: count
    result:
      type: command_status
      values:
      - accepted
      - rejected
      status: unknown
    side_effects:
    - 实际释放可能消耗弹药并创建依赖目标更新和制导的飞行武器；后续更新资源占用及效果取决于所选实现。
    ir_v1: fire_weapon
  settings:
  - name: external_update_required
    display_name: 是否必须接收外部目标更新
    type: boolean
    required: false
    sensitivity: model_characteristic
  - name: update_loss_coast_time
    display_name: 目标更新丢失后的维持时间
    type: duration
    required: false
    sensitivity: model_characteristic
    unit: s
  dependencies:
  - weapon_launch
  - target_tracking
  constraints:
  - 飞行武器必须配置兼容的制导与目标处理组件；依赖拦截计算时须有有效三维目标航迹。
  - 外部更新是条件依赖：要求上行时必须配置发送、接收和目标关联链路。
  limitations:
  - 制导处理器不能与另一套目标行为控制器无条件并用；目标切换和终端模式按所选实现解释。
  - 不把比例导航、引信计算或制导积分提升为独立行为能力，也不提供未经确认的运行时重定向动作。
  source_gaps:
  - 武器、发射计算机的运行时脚本接口参考（开火、停火、状态与库存读取的方法、参数、返回值）
  replaces:
  - 设置 是否必须接收外部目标更新 改用中立名 external_update_required
  - 设置 目标更新丢失后的维持时间 改用中立名 update_loss_coast_time
  binding: local
- id: cease_fire
  display_name: 停火
  aliases: []
  domain: weapon_employment
  subcategory: engagement_control
  kind: weapon
  description: 终止指定武器正在进行的射击或照射。
  natural_language:
    definition: 终止指定武器当前的交战：持续照射类武器停止照射，排队中的射击请求不再执行。
    use_when: 目标已被摧毁、目标丢失、出现友军风险或接到停火命令时。
    expected_result: 指定武器停止射击，已离架的弹药不受影响。
    boundaries:
    - 停火不召回已发射的弹药。
    - 持续照射武器未设定单次照射时间时，会一直照射到停火或热量耗尽。
    requirement_example: 目标被判定摧毁后各车停火，转入观察。
  tactical_uses:
  - 目标摧毁后停火
  - 友军进入射界时停火
  - 执行停火命令
  keywords:
  - 停火
  - 停止射击
  - cease fire
  - hold fire
  - stop firing
  applicable_platform_classes: *id001
  status: partial
  maturity: draft
  provides: []
  accepts:
  - ir: weapon_action.cease_fire
    display_name: 停止指定武器的射击
    status: partial
    ir_v1: null
    parameters:
    - name: weapon
      type: weapon_reference
      required: true
    - name: target
      type: track_reference
      required: false
    result:
      type: command_status
      values: &id002
      - accepted
      - rejected
      status: unknown
    side_effects:
    - 终止该武器当前交战；不影响已离架弹药。
    note: 来源在激光武器一节点名停火调用；其他武器的停火接口未给出。
  settings: []
  dependencies:
  - weapon_selection
  constraints: []
  limitations:
  - 来源只在激光武器中明确停火调用；对排队中的齐射请求是否同样有效未说明。
  source_gaps:
  - 武器、发射计算机的运行时脚本接口参考（开火、停火、状态与库存读取的方法、参数、返回值）
  binding: local
- id: weapon_power_control
  display_name: 武器开关
  aliases: []
  domain: weapon_employment
  subcategory: engagement_control
  kind: weapon
  description: 设定武器进入仿真时的开关状态，以及在运行中开启或关闭武器。
  natural_language:
    definition: 武器有开、关两种状态；可设定初始状态，运行中开关以组件命令实现。
    use_when: 需要武器在某一阶段才启用（如干扰器默认关闭、接敌前才打开）时。
    expected_result: 武器处于指定开关状态；关闭的武器不响应射击请求。
    boundaries:
    - 独立飞行弹药类武器默认开启，射频干扰器默认关闭。
    requirement_example: 干扰器在接近目标区前保持关闭，进入后开启。
  tactical_uses:
  - 阶段性启用武器
  - 干扰器按时开机
  - 保险状态
  keywords:
  - 武器开关
  - 开机
  - 关机
  - 保险
  - weapon on
  - weapon off
  - arm
  applicable_platform_classes: *id001
  status: partial
  maturity: draft
  provides:
  - ir: weapon_state.power
    display_name: 武器开关状态
    value_type: enumeration
    cardinality: per_weapon
    key: weapon_id
    values:
    - 'on'
    - 'off'
    freshness: dynamic
    status: unknown
    ir_v1: null
  accepts:
  - ir: weapon_action.set_weapon_power
    display_name: 开启或关闭武器
    status: unknown
    ir_v1: null
    parameters:
    - name: weapon
      type: weapon_reference
      required: true
    - name: power
      type: enumeration
      values:
      - 'on'
      - 'off'
      required: true
    result:
      type: command_status
      values: *id002
      status: unknown
    side_effects:
    - 关闭后武器不响应射击请求。
    note: IR 1.0 没有武器开关动作（ir_gap）。
  settings:
  - name: initial_power
    display_name: 初始开关状态
    type: enumeration
    values:
    - 'on'
    - 'off'
    required: false
    sensitivity: model_characteristic
  dependencies: []
  constraints: []
  limitations:
  - 初始状态来源有说明；运行中开关属于组件公共命令，不在本章。
  source_gaps:
  - 平台组件公共命令（3.1.1 节：组件开关、初始状态）
  - 武器、发射计算机的运行时脚本接口参考（开火、停火、状态与库存读取的方法、参数、返回值）
  binding: local
- id: weapon_cueing
  display_name: 武器指向目标
  aliases: []
  domain: weapon_employment
  subcategory: engagement_control
  kind: weapon
  description: 射击请求时自动把可转动的武器指向目标当前位置或预测拦截点。
  natural_language:
    definition: 收到射击请求时，支持指向的武器自动转向请求中的目标；可选指向目标当前位置或预测拦截位置。
    use_when: 炮塔、发射架需要转向目标才能射击时。
    expected_result: 武器在射击前指向目标，转动受转动范围和转速限制。
    boundaries:
