    - 机动杀伤目前只对陆地域的航路运动模型生效。
    - 火力杀伤并非对所有武器类型都生效。
    - 多次命中各自独立计算，不保证累积。
    - 对抗措施只有在同时满足距离、视角、持续时间条件后才生效，且一旦生效就保持。
    requirement_example: 敌反坦克导弹命中僚车，造成机动杀伤：僚车停在原地但仍可射击，转为固定火力点。
