- id: mobility_firepower_damage
  display_name: 机动/火力/摧毁分级毁伤
  aliases: []
  domain: weapon_employment
  subcategory: damage_effects
  kind: effect
  description: 弹药近炸后按概率给目标造成无毁伤、机动杀伤、火力杀伤、机动加火力杀伤或彻底摧毁；目标的对抗措施可削弱该效果。
  natural_language:
    definition: 引信起爆时若脱靶距离小于最大半径，先抽取是否造成毁伤，再按概率分配为机动杀伤（失去机动）、火力杀伤（武器失效）、两者兼有或彻底摧毁；按目标类型可用不同概率表。目标释放的对抗措施（如烟幕、诱饵）满足距离、视角和持续时间条件后，可换用降级表、按系数降低概率或直接使来袭弹药失效。
    use_when: 需要区分“打瘫”“打哑”“击毁”，或表达烟幕、诱饵对来袭弹药的削弱时。
    expected_result: 目标获得分级毁伤；机动杀伤的地面目标停止运动，火力杀伤的目标不能再发射独立飞行弹药。
