format: PlatformCapabilityCatalogPart
format_version: 0.3.0
catalog:
  id: afsim_2_9_capabilities
  platform_family: afsim
  platform_version: '2.9'
  language: zh-CN
  classification: public
  updated_on: '2026-10-16'
part:
  domain: environment
  display_name: 环境与区域类
  summary: 平台所处环境的判断：地形类别、区域、通视。
  subcategories:
  - id: terrain
    display_name: 地形
    summary: 地形类别、到某类地形的距离、坡度、通视。
  - id: zone
    display_name: 区域
    summary: 区域定义与区域内外、距离判断。
conventions:
  status: capability/provides/accepts 状态：available | partial | unavailable | unknown；partial = 来源有说明但接口参数或运行验证未完成；unknown
    = 推断存在但来源未给出接口。
  ir_v1: 对应 IR 1.0 的动作、操作数、函数或黑板（blackboard）；null 表示 IR 1.0 无对应项（ir_gap）。
capabilities:
- id: terrain_classification
  display_name: 地形类别
  aliases: []
  domain: environment
  subcategory: terrain
  kind: environment
  description: 判断平台当前所处的地形类别（开阔地、城区、林地等），以及到某类地形的距离。
  natural_language:
    definition: 按位置查询地形类别，或查询到最近某类地形的距离；也可读取坡度。
    use_when: 战术随地形变化时（开阔地楔形、接近城区转纵队）。
    expected_result: 得到当前地形类别和到指定类别的距离。
    boundaries:
    - 地形类别可由区域定义实现：每类地形对应一组区域。
    - 坡度依赖地形高程数据。
    requirement_example: 距城区 200 米以内时转为纵队。
  tactical_uses:
  - 依地形变换队形
  - 接近城区前转换
  - 避开开阔地
  keywords:
  - 地形
  - 城区
  - 开阔地
  - 林地
  - 坡度
  - terrain
  - urban
  - open
  - slope
  applicable_platform_classes: &id001
  - air_vehicle
  - ground_vehicle
  - surface_vessel
  - subsurface_vehicle
  - space_vehicle
  - static_node
  - weapon_platform
  status: unknown
  maturity: draft
  ir_v1:
  - terrain_value.class
  - terrain_value.distance_to_class
  - terrain_value.slope
  provides:
  - ir: environment_state.terrain_class
    display_name: 当前地形类别
    value_type: enumeration
    cardinality: one
    freshness: dynamic
    status: unknown
    ir_v1: terrain_value.class
  - ir: environment_state.distance_to_terrain_class
    display_name: 到某类地形的距离
    value_type: distance
    unit: m
    cardinality: one
    freshness: dynamic
    status: unknown
    ir_v1: terrain_value.distance_to_class
  - ir: environment_state.slope
    display_name: 当前坡度
    value_type: angle
    unit: deg
    cardinality: one
    freshness: dynamic
    status: unknown
    ir_v1: terrain_value.slope
  accepts: []
  settings: []
  dependencies:
  - zone_membership
  - own_kinematic_state
  constraints: []
  limitations:
  - 可由区域判断组合实现：地形类别 = 包含当前位置的区域所属类别；到类别的距离 = 到该类区域的最近距离。
  source_gaps:
  - 环境、地形与区域章节（地形类别、区域定义与运行时区域判断、通视计算）
  binding: local
- id: line_of_sight
  display_name: 通视判断
  aliases: []
  domain: environment
  subcategory: terrain
  kind: environment
  description: 判断与目标之间是否通视（不被地形遮挡）。
  natural_language:
    definition: 按地形高程判断两点之间是否通视。
    use_when: 需要“占领能看到敌方的位置”“利用遮蔽接近”时。
    expected_result: 得到与最近敌方是否通视。
    boundaries:
    - 依赖地形高程数据。
    requirement_example: 跃进到能通视敌方的位置后停车掩护。
  tactical_uses:
  - 选择掩护位置
  - 利用遮蔽
  keywords:
  - 通视
  - 遮蔽
  - 视线
  - line of sight
  - masking
  applicable_platform_classes: *id001
  status: unknown
  maturity: draft
  ir_v1:
  - terrain_value.line_of_sight_to_nearest_hostile
  provides:
  - ir: environment_state.line_of_sight_to_nearest_hostile
    display_name: 与最近敌方是否通视
    value_type: boolean
    cardinality: one
    freshness: dynamic
    status: unknown
    ir_v1: terrain_value.line_of_sight_to_nearest_hostile
  accepts: []
  settings: []
  dependencies:
  - target_tracking
  constraints: []
  limitations: []
  source_gaps:
  - 环境、地形与区域章节（地形类别、区域定义与运行时区域判断、通视计算）
  binding: local
- id: zone_membership
  display_name: 区域判断
  aliases: []
  domain: environment
  subcategory: zone
  kind: environment
  description: 在想定中定义区域，运行中判断平台是否在区域内、离区域多远。
  natural_language:
    definition: 区域在想定中按名称定义；运行中可判断某位置是否在区域内，以及到区域边界的距离。
    use_when: 需要“进入某区域时”“离目标区域多远”这类条件时，或用区域表示地形类别。
    expected_result: 得到是否在区域内与到区域的距离。
    boundaries:
    - 区域定义在想定配置中，运行中通常不改变。
    - 来源已证实区域可被其他组件按名称引用（如发射可接受区、区域衰减）；行为可调用的判断接口未见。
    requirement_example: 进入集结区后停车等待命令。
  tactical_uses:
  - 进入区域触发
  - 阶段线
  - 目标区域
  - 表示地形类别
  keywords:
  - 区域
  - 地域
  - 阶段线
  - 集结区
  - zone
  - area
  - phase line
  - region
  applicable_platform_classes: *id001
  status: partial
  maturity: draft
  provides:
  - ir: environment_state.in_zone
    display_name: 是否在区域内
    value_type: boolean
    cardinality: collection
    freshness: dynamic
    status: unknown
    ir_v1: null
  - ir: environment_state.distance_to_zone
    display_name: 到区域的距离
    value_type: distance
    unit: m
    cardinality: collection
    freshness: dynamic
    status: unknown
    ir_v1: null
  accepts: []
  settings:
  - name: zones
    display_name: 区域定义（名称、形状、所属类别）
    type: list
    required: false
    sensitivity: model_characteristic
  dependencies:
  - own_kinematic_state
  constraints: []
  limitations:
  - IR 1.0 没有区域操作数（ir_gap），目前只能通过地形类别间接使用。
  source_gaps:
  - 环境、地形与区域章节（地形类别、区域定义与运行时区域判断、通视计算）
  binding: local
