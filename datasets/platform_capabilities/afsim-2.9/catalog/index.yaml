    tactical_uses:
    - 加速通过开阔地
    - 接近城区减速
    - 跃进
    - 停车（速度降为零，见停止运动）
    keywords:
    - 速度
    - 加速
    - 减速
    - speed
    - throttle
    ir_v1:
    - set_speed
    commands:
    - mobility_action.set_speed
    observations: []
    file: catalog/mobility.yaml
  - id: altitude_control
