    - 按方位行进
    - 调整观察方向
    - 规避
    keywords:
    - 航向
    - 转向
    - 方位
    - heading
    - course
    - turn
    ir_v1:
    - set_heading
    commands:
    - mobility_action.turn_to_heading
    observations: []
    file: catalog/mobility.yaml
  - id: speed_control
    display_name: 速度控制
