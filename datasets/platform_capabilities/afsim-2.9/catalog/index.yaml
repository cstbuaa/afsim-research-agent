format: PlatformCapabilityIndex
format_version: 0.3.0
catalog:
  id: afsim_2_9_capabilities
  platform_family: afsim
  platform_version: '2.9'
  language: zh-CN
  classification: public
  updated_on: '2026-10-16'
usage:
- 先按领域（运动类、通信类、武器类……）和子类缩小范围，再按 keywords / tactical_uses / ir_v1 匹配，最后只把命中的条目从对应文件读入。
- split=false 的领域仍在 0.2.0 单文件目录中，尚未按新格式重整。
domains:
- id: mobility
  display_name: 运动类
  file: catalog/mobility.yaml
  format_version: 0.3.0
  split: true
  subcategories:
  - id: basic_maneuver
    display_name: 基本机动命令
    summary: 运行时下达的定点、航向、速度、高度与停止命令，是战术机动的基本单元。
  - id: route
    display_name: 路线与路网
    summary: 沿预设路线或道路网络行进，以及路线相关的事件与终点行为。
  - id: own_state
    display_name: 自身运动状态
    summary: 平台自身位置、速度、航向、高度的读取，用于到达判定、距离计算和队形保持。
  - id: following_formation
    display_name: 跟随与编队
    summary: 相对领队保持站位、跟随与路线切换、运行时变换队形。
  - id: domain_profile
    display_name: 运动域特性
    summary: 地面、空中、水面、水下、旋翼机等运动域的性能限值、适用命令与边界。
  - id: high_fidelity_flight
    display_name: 高保真飞行
    summary: 基于质量、气动与推进数据的六自由度飞行及其控制开关。
  - id: trajectory_playback
    display_name: 轨迹回放
    summary: 按记录的时空位置数据重放运动。
  - id: space
    display_name: 航天运动
    summary: 轨道传播、轨道机动与在轨姿态控制。
  - id: munition_flyout
    display_name: 弹药飞行
    summary: 导弹、炸弹、炮弹、火箭等被发射后的飞行模型，行为层通常不直接操纵。
  - id: towed
    display_name: 拖曳
    summary: 拖曳资产的部署几何与卷收。
  - id: fidelity_selection
    display_name: 保真度选择
    summary: 按保真度在多个运动模型之间选择。
  capabilities:
  - id: point_navigation
    display_name: 定点机动
    subcategory: basic_maneuver
    kind: mover
    status: available
    platform_classes: &id001
    - air_vehicle
    - ground_vehicle
    - surface_vessel
    - subsurface_vehicle
    summary: 命令平台离开当前运动目标，向给定的地理位置机动。
    tactical_uses:
    - 交替跃进到新掩护位置
    - 前出侦察
    - 占领阵地
    - 机动到集结点
    - 按计算出的队形站位机动
    keywords:
    - 定点
    - 机动到
    - 前往
    - 跃进
    - 占领位置
    - go to location
    - move to position
    - waypoint-free
    ir_v1:
    - bound_to_position
    - move_to_position
    - mover_value.at_destination
    commands:
    - mobility_action.go_to_location
    observations:
    - mobility_state.at_destination
    file: catalog/mobility.yaml
  - id: heading_control
    display_name: 航向控制
    subcategory: basic_maneuver
    kind: mover
    status: available
    platform_classes: *id001
    summary: 命令平台把运动方向转到给定的方位角。
    tactical_uses:
