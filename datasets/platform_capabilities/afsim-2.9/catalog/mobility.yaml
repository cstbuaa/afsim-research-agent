format: PlatformCapabilityCatalogPart
format_version: 0.3.0
catalog:
  id: afsim_2_9_capabilities
  platform_family: afsim
  platform_version: '2.9'
  language: zh-CN
  classification: public
  updated_on: '2026-10-16'
part:
  domain: mobility
  display_name: 运动类
  summary: 平台如何运动、行为能下达哪些机动命令、能读取哪些自身运动状态。
  subcategories:
  - id: basic_maneuver
    display_name: 基本机动命令
    summary: 运行时下达的定点、航向、速度、高度与停止命令，是战术机动的基本单元。
  - id: route
    display_name: 路线与路网
    summary: 沿预设路线或道路网络行进，以及路线相关的事件与终点行为。
  - id: own_state
    display_name: 自身运动状态
    summary: 平台自身位置、速度、航向、高度的读取，用于到达判定、距离计算和队形保持。
  - id: following_formation
    display_name: 跟随与编队
    summary: 相对领队保持站位、跟随与路线切换、运行时变换队形。
  - id: domain_profile
    display_name: 运动域特性
    summary: 地面、空中、水面、水下、旋翼机等运动域的性能限值、适用命令与边界。
  - id: high_fidelity_flight
    display_name: 高保真飞行
    summary: 基于质量、气动与推进数据的六自由度飞行及其控制开关。
  - id: trajectory_playback
    display_name: 轨迹回放
    summary: 按记录的时空位置数据重放运动。
  - id: space
    display_name: 航天运动
    summary: 轨道传播、轨道机动与在轨姿态控制。
  - id: munition_flyout
    display_name: 弹药飞行
    summary: 导弹、炸弹、炮弹、火箭等被发射后的飞行模型，行为层通常不直接操纵。
  - id: towed
    display_name: 拖曳
    summary: 拖曳资产的部署几何与卷收。
  - id: fidelity_selection
    display_name: 保真度选择
    summary: 按保真度在多个运动模型之间选择。
conventions:
  status: capability/provides/accepts 状态：available | partial | unavailable | unknown；partial = 来源有说明但接口参数或运行验证未完成；unknown
    = 推断存在但来源未给出接口。
  ir_v1: 对应 IR 1.0 的动作或操作数；null 表示 IR 1.0 无对应项（ir_gap）。
  kind: mover = 运动组件直接提供；composite = 由其他能力组合实现（见 composed_of）；state = 状态读取。
  replaces: 记录从 0.2.0 目录迁移来的条目，便于对照。
capabilities:
- id: point_navigation
  display_name: 定点机动
  aliases: []
  domain: mobility
  subcategory: basic_maneuver
  kind: mover
  description: 在运行时命令平台机动到指定地理位置。
  natural_language:
    definition: 命令平台离开当前运动目标，向给定的地理位置机动。
    use_when: 跃进到新的掩护位置、占领阵地、前出到侦察点、飞向指定点等不依赖预设路线的机动。
    expected_result: 平台向指定位置运动；是否到达、到达后停止还是继续运动，需要另行观测或命令。
    boundaries:
    - 不包含路径规划、通行性判断或避障，接近方式由具体运动实现决定。
    - 到达以到达状态判定；到达后的运动行为（停止或继续）由具体运动实现决定，需在绑定时明确。
    requirement_example: 跃进组接到命令后机动到前方指定位置，到达后停车并转为掩护。
  tactical_uses:
  - 交替跃进到新掩护位置
  - 前出侦察
  - 占领阵地
  - 机动到集结点
  - 按计算出的队形站位机动
  keywords:
  - 定点
  - 机动到
  - 前往
  - 跃进
  - 占领位置
  - go to location
  - move to position
  - waypoint-free
  applicable_platform_classes: &id001
  - air_vehicle
  - ground_vehicle
  - surface_vessel
  - subsurface_vehicle
  status: available
  maturity: reviewed
  ir_v1:
  - move_to_position
  - bound_to_position
  provides:
  - ir: mobility_state.at_destination
    display_name: 已到达指定位置
    value_type: boolean
    cardinality: one
    freshness: event
    status: supported
    ir_v1: mover_value.at_destination
    note: 来源未给出到达事件；可由自身位置与目标位置的距离判定。
    basis: user_attested
  accepts:
  - ir: mobility_action.go_to_location
    display_name: 机动到指定位置
    status: supported
    ir_v1: move_to_position
    parameters:
    - name: position
      type: geo_position
      reference: wgs84
      required: true
    result:
      type: command_status
      values: &id002
      - accepted
      - rejected
      status: unknown
    side_effects:
    - 请求生效时替换当前运动目标，可能中断正在执行的路线；是否返回原路线需另行请求。
    note: 来源只给出方法名，未给出参数（是否包含高度、速度）与返回值。
    basis: user_attested
  settings: []
  dependencies: []
  constraints:
  - 平台需配置可接受运行时导航命令的运动组件。
  limitations:
  - 参数以本目录契约为准，原生调用与结果映射由适配层实现，尚未运行验证。
  binding: local
  confirmation:
    basis: user_attested
    by: user
    confirmed_on: '2026-10-16'
    note: 手册无运行时脚本接口参考；平台使用者确认这些接口可以实现。参数以本目录契约为准，原生调用由适配层实现；尚未运行验证。
    interfaces:
    - mobility_action.go_to_location
    - mobility_state.at_destination
- id: heading_control
  display_name: 航向控制
  aliases: []
  domain: mobility
  subcategory: basic_maneuver
  kind: mover
  description: 在运行时命令平台转向指定航向。
  natural_language:
    definition: 命令平台把运动方向转到给定的方位角。
    use_when: 调整行进方向、转向观察方向、规避或在无路线时按方位行进。
    expected_result: 平台在转弯性能限制内转向请求的方向。
    boundaries:
    - 多数运动模型把“航向”请求按航迹方向（速度矢量方向）执行；机身朝向与航迹方向可能不同。
    - 旋翼机在低于风标速度时可单独设定机身朝向，见旋翼机运动。
    - 转向可能使平台偏离当前路线。
    requirement_example: 排长车在开阔地按 045 度方向行进，接近城区后转向 090 度。
  tactical_uses:
  - 转向
  - 按方位行进
  - 调整观察方向
  - 规避
  keywords:
  - 航向
  - 转向
  - 方位
  - heading
  - course
  - turn
  applicable_platform_classes: *id001
  status: available
  maturity: reviewed
  ir_v1:
  - set_heading
  provides: []
  accepts:
  - ir: mobility_action.turn_to_heading
    display_name: 转向指定航向
    status: supported
    ir_v1: set_heading
    parameters:
    - name: heading
      type: angle
      unit: deg
      reference: true_north_clockwise
      required: true
    result:
      type: command_status
      values: *id002
      status: unknown
    side_effects:
    - 请求生效时改变运动方向，可能中断路线跟随。
    note: 来源说明多数运动模型按航迹方向执行航向请求。
    basis: user_attested
  settings:
  - name: turn_rate_limit
    display_name: 转弯角速率限制
    type: angular_speed
    unit: deg/s
    required: false
    sensitivity: model_characteristic
  - name: maximum_radial_acceleration
    display_name: 最大径向加速度
    type: acceleration
    unit: m/s^2
    required: false
    sensitivity: model_characteristic
  dependencies: []
  constraints: []
  limitations:
  - 参数以本目录契约为准，原生调用与结果映射由适配层实现，尚未运行验证。
  binding: local
  confirmation:
    basis: user_attested
    by: user
    confirmed_on: '2026-10-16'
    note: 手册无运行时脚本接口参考；平台使用者确认这些接口可以实现。参数以本目录契约为准，原生调用由适配层实现；尚未运行验证。
    interfaces:
    - mobility_action.turn_to_heading
- id: speed_control
  display_name: 速度控制
  aliases: []
  domain: mobility
  subcategory: basic_maneuver
  kind: mover
  description: 在运行时请求平台改变运动速度。
  natural_language:
    definition: 命令平台向请求的速度过渡，过渡过程受加速度限值约束。
    use_when: 加速、减速、协调到达时机，或在接近任务区域、城区时降速。
    expected_result: 平台向请求速度过渡；新的速率在被路线或其他命令改变前保持。
    boundaries:
    - 速度请求受各运动域的最大、最小速度限制。
    - 实际速度需通过自身运动状态另行观测。
    requirement_example: 车队在开阔地以较高速度行进，接近城区时降低行驶速度。
  tactical_uses:
  - 加速通过开阔地
  - 接近城区减速
  - 跃进
  - 停车（速度降为零，见停止运动）
  keywords:
  - 速度
  - 加速
  - 减速
  - speed
  - throttle
  applicable_platform_classes: *id001
  status: available
  maturity: reviewed
  ir_v1:
  - set_speed
  provides: []
  accepts:
  - ir: mobility_action.set_speed
    display_name: 调整速度
    status: supported
    ir_v1: set_speed
    aliases_ir:
    - mobility_action.set_ground_speed
    - mobility_action.set_air_speed
    - mobility_action.set_surface_speed
    parameters:
    - name: target_speed
      type: speed
      unit: m/s
      required: true
    result:
      type: command_status
      values: *id002
      status: unknown
    side_effects:
    - 请求生效时改变目标速度及后续运动；道路、地形与性能约束仍然适用。
    basis: user_attested
  settings:
  - name: maximum_speed
    display_name: 最大速度
    type: speed
    unit: m/s
    required: false
    sensitivity: model_characteristic
  - name: minimum_speed
    display_name: 最小速度
    type: speed
    unit: m/s
    required: false
    sensitivity: model_characteristic
  - name: maximum_linear_acceleration
    display_name: 最大线加速度
    type: acceleration
    unit: m/s^2
    required: false
    sensitivity: model_characteristic
  dependencies: []
  constraints: []
  limitations:
  - 参数以本目录契约为准，原生调用与结果映射由适配层实现，尚未运行验证。
  replaces:
  - air_navigation.accepts[mobility_action.set_air_speed]
  - ground_navigation.accepts[mobility_action.set_ground_speed]
  - surface_navigation.accepts[mobility_action.set_surface_speed]
  binding: local
  confirmation:
    basis: user_attested
    by: user
    confirmed_on: '2026-10-16'
    note: 手册无运行时脚本接口参考；平台使用者确认这些接口可以实现。参数以本目录契约为准，原生调用由适配层实现；尚未运行验证。
    interfaces:
    - mobility_action.set_speed
- id: altitude_control
  display_name: 高度控制
  aliases: []
  domain: mobility
  subcategory: basic_maneuver
  kind: mover
  description: 在运行时命令空中平台改变高度。
  natural_language:
    definition: 命令空中平台向请求的高度爬升或下降。
    use_when: 改变巡航高度、低空突防、爬升规避。
    expected_result: 平台在爬升率与航迹角限制内向请求高度过渡。
    boundaries:
    - 部分低保真空中模型的高度过渡不连续（不建模垂直加速度）。
    - 高度基准待在绑定中确认。
    - 地面车辆不适用。
    requirement_example: 侦察机接近目标区前下降到指定高度。
  tactical_uses:
  - 改变高度
  - 低空突防
  - 爬升
  keywords:
  - 高度
  - 爬升
  - 下降
  - altitude
  - climb
  - descend
  applicable_platform_classes:
  - air_vehicle
  status: available
  maturity: reviewed
  ir_v1:
  - set_altitude
  provides: []
  accepts:
  - ir: mobility_action.go_to_altitude
    display_name: 改变高度
    status: supported
    ir_v1: set_altitude
    parameters:
    - name: altitude
      type: distance
      unit: m
      required: true
    result:
      type: command_status
      values: *id002
      status: unknown
    side_effects:
    - 请求生效时改变目标高度及后续垂直运动。
    note: 高度基准（平均海平面或地面以上）未在来源中说明。
    basis: user_attested
  settings:
  - name: maximum_climb_rate
    display_name: 最大爬升率
    type: speed
    unit: m/s
    required: false
    sensitivity: model_characteristic
  - name: maximum_flight_path_angle
    display_name: 最大航迹角
    type: angle
    unit: deg
    required: false
    sensitivity: model_characteristic
  - name: minimum_altitude
    display_name: 最低高度
    type: distance
    unit: m
    required: false
    sensitivity: model_characteristic
  - name: maximum_altitude
    display_name: 最高高度
    type: distance
    unit: m
    required: false
    sensitivity: model_characteristic
  dependencies: []
  constraints: []
  limitations:
  - 参数以本目录契约为准，原生调用与结果映射由适配层实现，尚未运行验证。
  binding: local
  confirmation:
    basis: user_attested
    by: user
    confirmed_on: '2026-10-16'
    note: 手册无运行时脚本接口参考；平台使用者确认这些接口可以实现。参数以本目录契约为准，原生调用由适配层实现；尚未运行验证。
    interfaces:
    - mobility_action.go_to_altitude
- id: motion_halt
  display_name: 停止运动
  aliases: []
  domain: mobility
  subcategory: basic_maneuver
  kind: composite
  description: 使平台停止运动并停留在当前位置（组合能力）。
  natural_language:
    definition: 通过把速度降为零，或让路线在终点停止，使平台停止运动。
    use_when: 占领掩护位置、停车观察、交替跃进中掩护组停止、到达目标后停止。
    expected_result: 平台减速至停止；停止后是否保持位置取决于运动实现。
    boundaries:
    - 来源中没有专用的停止命令。
    - 停止由速度置零实现，或在路线终点停止；停止后是否保持位置需运行验证
    - 路线终点停止只在走完路线时生效，路线默认在终点继续外推。
    requirement_example: 跃进组到达新位置后停车，转为掩护。
  tactical_uses:
  - 停车掩护
  - 占领阵地
  - 停车观察
  - 到达后停止
  keywords:
  - 停止
  - 停车
  - 就地
  - halt
  - stop
  - hold position
  applicable_platform_classes: *id001
  status: available
  maturity: reviewed
  ir_v1:
  - halt
  - hold_overwatch_position
  provides: []
  accepts: []
  settings: []
  dependencies:
  - speed_control
  - route_navigation
  composed_of:
  - capability: speed_control
    use: mobility_action.set_speed
    with:
      target_speed: 0
    when: 运行中随时停止
  - capability: route_navigation
    use: setting end_behavior
    with:
      end_behavior: stop
    when: 走完路线时停止
  constraints: []
  limitations:
  - 组合方式尚未运行验证。
  binding: local
  confirmation:
    basis: derived_from_user_attested
    by: user
    confirmed_on: '2026-10-16'
    note: 由已确认的基础能力组合；组合方式尚未运行验证。
- id: route_navigation
  display_name: 路线导航
  aliases: []
  domain: mobility
  subcategory: route
  kind: mover
  description: 沿预设或运行时指定的航点路线行进，并在临时机动后返回路线。
  natural_language:
    definition: 依次通过路线中的航点，在位置与速度约束下把平台引导到任务区域。
    use_when: 巡逻、转移、按计划路线接近任务区域，或临时机动后返回原路线。
    expected_result: 平台沿路线前进；临时改变运动后可请求返回路线；到达终点时按终点行为处理。
    boundaries:
    - 路线可执行性受转弯、速度、加速度以及所处运动域限制。
    - 路线末端可能继续外推、停止或移除平台，不能默认为到达后停止。
    - 不承诺路径自动避障或所有导航实现都接受相同的运行时操作。
    - 终点行为默认继续外推（沿最后的航向和速度继续运动），不会自动停止。
    - 航点切换可设为接近航点时切换或通过航点后切换（默认）。
    requirement_example: 沿指定巡逻路线移动，完成临时机动后恢复原路线；走完路线后停车。
  tactical_uses:
  - 按计划路线行进
  - 巡逻
  - 临时机动后返回路线
  - 到达路线终点后停止
  keywords:
  - 路线
  - 航点
  - 沿路线
  - 返回路线
  - route
  - waypoint
  - follow route
  - return to route
  applicable_platform_classes:
  - air_vehicle
  - ground_vehicle
  - surface_vessel
  - subsurface_vehicle
  - weapon_platform
  status: partial
  maturity: reviewed
  ir_v1:
  - follow_route
  provides:
  - ir: route_state.waypoint_passed
    display_name: 通过或跳过航点
    value_type: string
    cardinality: collection
    freshness: event
    status: partial
    ir_v1: null
    note: 来源说明通过或跳过航点时会执行该航点挂接的脚本，可作为事件来源；没有通用读取接口。
  - ir: route_state.end_of_path
    display_name: 走完路线
    value_type: boolean
    cardinality: one
    freshness: event
    status: unknown
    ir_v1: mover_value.route_complete
    note: 来源只给出终点行为配置，未给出可观测的事件或状态。
  accepts:
  - ir: mobility_action.follow_route
    display_name: 沿指定路线行进
    status: supported
    ir_v1: follow_route
    parameters:
    - name: route
      type: route_reference
      required: true
    result:
      type: command_status
      values: *id002
      status: unknown
    side_effects:
    - 请求生效时以新路线替换当前运动目标。
    note: 来源在空战运动模型一节将其列为常规运动命令，参数与适用范围待核实。
    basis: user_attested
  - ir: mobility_action.resume_route
    display_name: 恢复路线
    status: supported
    ir_v1: null
    parameters: []
    result:
      type: command_status
      values: *id002
      status: unknown
    side_effects:
    - 请求生效时可改变当前导航目标并恢复路线跟随；是否返回路线仍需后续观测。
    note: IR 1.0 没有对应动作（ir_gap：return_to_route）。
    basis: user_attested
  settings:
  - name: route_reference
    display_name: 路线标识
    type: string
    required: false
    sensitivity: public_generic
  - name: start_label
    display_name: 起始航点标签
    type: string
    required: false
    sensitivity: public_generic
  - name: start_time
    display_name: 开始移动时间
    type: duration
    unit: s
    required: false
    sensitivity: public_generic
  - name: end_behavior
    display_name: 路线终点行为
    type: enumeration
    values:
    - extrapolate
    - stop
    - remove
    required: false
    sensitivity: public_generic
  - name: waypoint_switching
    display_name: 航点切换方式
    type: enumeration
    values:
    - on_approach
    - on_passing
    required: false
    sensitivity: public_generic
  - name: turn_failure_behavior
