- id: towed_asset_recovery
  display_name: 拖曳资产部署与回收
  aliases: []
  domain: mobility
  subcategory: towed
  kind: mover
  description: 拖曳资产按部署几何跟随承载平台，并按设定时机和速度卷回。
  natural_language:
    definition: 由承载平台指定一项已部署的拖曳资产，在指定时机以给定速度将该资产卷回。
    use_when: 拖曳任务结束或平台需要回收已部署资产时。
    expected_result: 到达卷收时机后按设定速率回收指定资产。
    boundaries:
    - 本能力不部署资产，也不保证回收后恢复可重复使用数量。
    - 承载平台消失可能直接移除资产，而不是完成回收。
    - 每次请求必须明确指定一项由本承载平台部署的拖曳资产，不隐式选择首项或全部资产。
    - 拖曳资产以武器方式发射后才进入仿真；承载平台被摧毁时资产被移除。
    - 可沿承载平台的航迹跟随，或按相对方位、俯仰刚性跟随。
    requirement_example: 同时部署多项拖曳资产时，只为指定的一项安排卷收，并给定回收时机和正的回收速度。
  tactical_uses:
  - 拖曳诱饵
  - 拖曳声呐
  keywords:
  - 拖曳
  - 诱饵
  - 卷收
  - towed
  - decoy
  - reel in
  applicable_platform_classes:
  - air_vehicle
  - surface_vessel
  - subsurface_vehicle
  status: partial
  maturity: draft
  provides: []
  accepts:
  - ir: mobility_action.schedule_towed_recovery
    display_name: 安排拖曳资产卷收
    status: partial
    parameters:
    - name: towed_asset
      type: platform_reference
      required: true
    - name: recovery_start_time
      type: duration
      unit: s
      reference: simulation_start
      required: true
    - name: recovery_speed
      type: speed
      unit: m/s
      required: true
    result:
      type: command_status
      values:
      - accepted
      - rejected
      status: unknown
    side_effects:
    - 可分别改变指定资产的卷收时机和速率，两项设置不保证原子生效；实际卷收可改变拖曳距离，库存恢复仍取决于独立配置。
    ir_v1: null
  settings:
  - name: tow_length
    display_name: 期望拖曳长度
    type: distance
    unit: m
    required: false
    sensitivity: model_characteristic
  - name: reel_out_speed
    display_name: 卷出速度
    type: speed
    unit: m/s
    required: false
    sensitivity: model_characteristic
  - name: reel_in_speed
    display_name: 卷入速度
    type: speed
    unit: m/s
    required: false
    sensitivity: model_characteristic
  - name: follow_lead_trajectory
    display_name: 沿承载平台航迹跟随
    type: boolean
    required: false
    sensitivity: public_generic
  - name: azimuth_relative_to_lead
    display_name: 相对承载平台方位
    type: angle
    unit: deg
    required: false
    sensitivity: model_characteristic
  - name: elevation_relative_to_lead
    display_name: 相对承载平台俯仰
    type: angle
    unit: deg
    required: false
    sensitivity: model_characteristic
  - name: restore_quantity
    display_name: 回收后恢复数量
    type: boolean
    required: false
    sensitivity: public_generic
  dependencies: []
  constraints:
  - 目标引用必须指向仍存在且由发起请求的承载平台部署的拖曳资产。
  - 每次请求只作用于明确指定的单项资产。
  - 回收速度必须为正，并同时设定卷收时机。
  limitations:
  - 动作需要组合设置时机和速率，两次调用不保证原子完成，标准化结果仍待验证。
  binding: local
