      - inertial_velocity
      required: true
    result:
      type: command_status
      values:
      - accepted
      - rejected
      status: unknown
    side_effects:
    - 请求生效时可改变平台指向目标及后续姿态；转动受所选姿态控制约束。
    ir_v1: null
  settings:
  - name: maximum_yaw_rate
    display_name: 最大偏航角速率
    type: angular_speed
    unit: deg/s
    required: false
    sensitivity: model_characteristic
  - name: maximum_pitch_rate
    display_name: 最大俯仰角速率
    type: angular_speed
    unit: deg/s
    required: false
    sensitivity: model_characteristic
  - name: maximum_roll_rate
    display_name: 最大滚转角速率
    type: angular_speed
    unit: deg/s
    required: false
    sensitivity: model_characteristic
  - name: attitude_controller
    display_name: 姿态控制器
