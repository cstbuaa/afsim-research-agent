    dependencies: []
    constraints: ["选择器须属于已配置的基础树或高级树，并从模型注册关联解析树种类；树种类与策略不匹配时必须在绑定前拒绝。", "首个合格仅适用基础树；首个成功仅适用普通高级选择器，按节点失败结果尝试后续分支，全部失败则没有成功胜出分支。", "优先级策略取最高值，加权随机按相对权重解释而非等概率；资格和数值由具体模型规则约束。"]
    limitations: ["原生选择节点把选择与执行连接；这里只部分观测选择，未提供选择而不执行的原生命令。", "基础树可通过明确接入的事件及选择路径插桩关联胜出节点；高级树精确选择结果读取未确认。高级运行中不当作失败或首个成功，不推断未确认的后继访问规则。", "基础树保持时间及重复选择计数改变何时重新选择；不能把每次叶更新都计为新的决策。带记忆高级选择器不由普通首个成功策略隐式绑定。"]
