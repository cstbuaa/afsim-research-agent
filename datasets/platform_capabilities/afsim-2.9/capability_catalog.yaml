    binding: local

  - id: track_quality_assessment
    display_name: 航迹质量评估
    aliases: []
    domain: tracking
    kind: processor
    description: 按航迹读取质量分值及距上次更新时间，辅助判断报告可用性。
    natural_language:
      definition: 分别检查航迹质量和报告时效，判断是否适合当前行为使用。
      use_when: 行为需要决定接受、复核或等待更可靠的目标信息时。
      expected_result: 得到每条航迹的无量纲质量值和更新年龄。
      boundaries: [质量值不是目标存在概率、识别正确率或威胁分值。, 高质量值不能替代位置和来源有效性检查。]
      requirement_example: 对过旧或低质量的航迹等待复核，不直接将其用于精确行动。
