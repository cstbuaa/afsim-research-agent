      - {ir: sensing_coverage.mean_revisit_gap, display_name: 网格平均重访间隙, value_type: duration, unit: s, cardinality: collection, item_scope: per_grid_point, key: coverage_grid_point_id, freshness: final, status: unknown}
    accepts: []
    settings:
