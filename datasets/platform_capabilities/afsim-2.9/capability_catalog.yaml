format: PlatformCapabilityCatalog
format_version: 0.2.0
catalog:
  id: afsim_2_9_capabilities
  display_name: AFSIM 2.9 Capability Profile
  platform_family: afsim
  platform_version: "2.9"
  language: zh-CN
  classification: public
  updated_on: 2026-10-15

platform_classes:
  - id: air_vehicle
    status: available
  - id: ground_vehicle
    status: available
  - id: surface_vessel
    status: available
  - id: subsurface_vehicle
    status: available
  - id: space_vehicle
    status: available
  - id: static_node
    status: available
  - id: weapon_platform
    status: available

capability_domains:
  - id: mobility
  - id: sensing
  - id: tracking
  - id: communication
  - id: command_and_control
  - id: tasking
  - id: weapon_employment
  - id: electronic_warfare
  - id: cyber_operations
  - id: resource_management
  - id: survivability
  - id: autonomy

common_semantics:
  lifecycle_availability: [available, unavailable]
  power_state: ["on", "off"]
  operational_state: [operational, non_operational]
  health_state: [healthy, degraded, failed]
  command_results: [accepted, rejected, in_progress, completed, failed, cancelled]
  cardinalities: [one, per_sensor, per_track, per_task, per_weapon, collection]
  support_statuses: [supported, partial, platform_missing, ir_gap, unknown]

capabilities:
  - id: platform_status_monitoring
    display_name: 平台状态监测
    aliases: []
    domain: survivability
    kind: processor
    description: 读取本平台损伤程度，为继续执行或退出任务提供依据。
    natural_language:
      definition: 监测本平台由完好到完全损坏的损伤程度。
      use_when: 行为需要依据受损程度决定是否继续行动、撤离或请求支援时。
      expected_result: 获得当前损伤比例，并据此识别任务执行风险。
      boundaries:
        - 损伤比例不是故障诊断，也不直接等同于每个子系统的可用性。
        - 已移除的平台不能继续提供有效状态；完全损坏后能否继续移动取决于平台处置规则。
      requirement_example: 平台受损后检查损伤程度，再决定是否退出当前巡逻。
    applicable_platform_classes: [air_vehicle, ground_vehicle, surface_vessel, subsurface_vehicle, space_vehicle, static_node, weapon_platform]
    status: available
    maturity: draft
    provides:
      - {ir: platform_state.damage_fraction, display_name: 平台损伤比例, value_type: real, unit: "1", range: [0, 1], cardinality: one, freshness: dynamic, status: supported}
    accepts: []
    settings: []
    dependencies: []
    constraints: [仅对仍存在且可访问的本平台有效。]
    limitations: [不承诺根据一个损伤比例推算剩余作战效能或存活概率。]
    binding: local

  - id: component_health_management
    display_name: 组件健康状态管理
    aliases: []
    domain: survivability
    kind: processor
    description: 按组件区分损伤和可操作状态，为行为选择可用设备提供依据。
    natural_language:
      definition: 以组件身份为单位管理健康判据，区分受损程度与能否执行操作。
      use_when: 任务需要判断某个设备是否仍可承担工作或需要换用其他设备时。
      expected_result: 得到带组件身份的健康状态，避免把一个设备故障误认为整个平台故障。
      boundaries:
        - 本能力只归纳状态读取，不承诺运行时修复、重启或恢复组件的动作。
        - 关闭、不可操作和完全损坏是不同状态，不能相互替代。
        - 各组件的状态读取方式仍需逐类核实。
      requirement_example: 设备受损后按组件检查可操作状态，仅向仍可用的设备分配任务。
    applicable_platform_classes: [air_vehicle, ground_vehicle, surface_vessel, subsurface_vehicle, space_vehicle, static_node, weapon_platform]
    status: partial
    maturity: draft
    provides:
      - {ir: component_state.damage_fraction, display_name: 组件损伤比例, value_type: real, unit: "1", range: [0, 1], cardinality: collection, item_scope: per_component, key: component_id, freshness: dynamic, status: unknown}
      - {ir: component_state.operational, display_name: 组件可操作性, value_type: enumeration, values: [operational, non_operational], cardinality: collection, item_scope: per_component, key: component_id, freshness: dynamic, status: unknown}
    accepts: []
    settings:
      - {name: automatic_recovery_delay, display_name: 自动恢复等待时间, type: duration, unit: s, required: false, sensitivity: model_characteristic}
      - {name: recoverable, display_name: 允许恢复, type: boolean, required: false, sensitivity: model_characteristic}
    dependencies: []
    constraints: [仅适用于实现相应公共状态语义的组件。, 组件完全损坏后的自动恢复需要允许恢复且等待时间为正。]
    limitations: [状态读取绑定尚未确认，不能据此宣称通用组件修复接口可用。, 不可恢复的完全损坏组件不能修复。]
    binding: local

  - id: route_navigation
    display_name: 路线导航
    aliases: []
    domain: mobility
    kind: mover
    description: 沿航点路线移动，并在临时机动后恢复原路线。
    natural_language:
      definition: 依次通过路线中的位置与速度约束，将平台引导到任务区域。
      use_when: 巡逻、转移或接近任务需要连续通过一组航点时。
      expected_result: 平台沿可执行路线前进，临时改变运动后可请求返回路线。
      boundaries:
        - 路线可执行性受转弯、速度、加速度以及所处运动域限制。
        - 路线末端可能继续外推、停止或移除平台，不能默认为到达后停止。
        - 不承诺路径自动避障或所有导航实现都接受相同的运行时操作。
      requirement_example: 沿指定巡逻路线移动，完成临时机动后恢复原路线。
    applicable_platform_classes: [air_vehicle, ground_vehicle, surface_vessel, subsurface_vehicle, weapon_platform]
    status: partial
    maturity: draft
    provides: []
    accepts:
      - ir: mobility_action.resume_route
        display_name: 恢复路线
        status: partial
        parameters: []
        result: {type: command_status, values: [accepted, rejected], status: unknown}
        side_effects:
          - "请求生效时可改变当前导航目标并恢复路线跟随；是否返回路线仍需后续观测。"
    settings:
      - {name: route_reference, display_name: 任务路线标识, type: string, required: true, sensitivity: public_generic}
      - {name: end_behavior, display_name: 路线末端行为, type: enumeration, values: [continue, stop, remove], required: false, sensitivity: public_generic}
    dependencies: []
    constraints: [平台必须具备可执行航点路线的导航组件并已分配路线。]
    limitations: [已确认部分飞行导航的运行时返回路线操作，其他运动域与标准化结果映射仍待核实。]
    binding: local

  - id: formation_following
    display_name: 编队跟随
    aliases: []
    domain: mobility
    kind: mover
    description: 跟随领队运动，并以相对位置监测编队站位。
    natural_language:
      definition: 依据领队的运动保持预定相对站位，并将站位偏差作为行为判断依据。
      use_when: 多个平台需要随领队共同移动且保留明确的相对空间关系时。
      expected_result: 跟随平台朝预定站位运动，行为能够按领队参考关系评估位置。
      boundaries:
        - 不提供自动选举领队、编队重组或避碰保证。
        - 参考平台消失后的处置取决于具体跟随实现。
        - 相对位置需保留参考系，读取绑定尚未逐类确认。
      requirement_example: 跟随领队保持侧后方站位，依据相对位置判断是否脱离编队。
    applicable_platform_classes: [air_vehicle, ground_vehicle, surface_vessel, subsurface_vehicle]
    status: partial
    maturity: draft
    provides:
      - {ir: formation_state.relative_forward, display_name: 相对领队前向位置, value_type: distance, unit: m, cardinality: one, reference_frame: leader_body, freshness: dynamic, status: unknown}
      - {ir: formation_state.relative_right, display_name: 相对领队右向位置, value_type: distance, unit: m, cardinality: one, reference_frame: leader_body, freshness: dynamic, status: unknown}
      - {ir: formation_state.relative_down, display_name: 相对领队下向位置, value_type: distance, unit: m, cardinality: one, reference_frame: leader_body, freshness: dynamic, status: unknown}
    accepts: []
    settings:
      - {name: leader, display_name: 领队平台, type: platform_reference, required: true, sensitivity: public_generic}
      - {name: desired_forward_offset, display_name: 期望前向偏移, type: distance, unit: m, required: false, sensitivity: public_generic}
      - {name: desired_right_offset, display_name: 期望右向偏移, type: distance, unit: m, required: false, sensitivity: public_generic}
      - {name: desired_down_offset, display_name: 期望下向偏移, type: distance, unit: m, required: false, sensitivity: public_generic}
    dependencies: []
    constraints: [领队平台必须存在且具有可用运动状态。, 跟随模式须与具体平台运动域和运动约束匹配。, 期望站位与观测位置比较前必须转换到相同参考系。]
    limitations: [相对位置契约是从平台状态访问与相对几何观测归纳的待绑定接口，不是已确认的通用读取方法。, 刚性偏移跟随不代表真实的编队捕获动力学。]
    binding: local

  - id: air_navigation
    display_name: 空中导航
    aliases: []
    domain: mobility
    kind: mover
    description: 在空中调整飞行速度，配合路线完成空域机动。
    natural_language:
      definition: 使飞行平台在其速度与机动包线内响应速度请求。
      use_when: 飞行任务需要加速、减速或与其他平台协调到达时机时。
      expected_result: 平台向请求速度过渡，过渡过程受飞行性能限制。
      boundaries:
        - 不承诺连续垂直过渡、完整空气动力学或自动起降。
        - 航迹方向与机身朝向可能不同，不能将二者混为一谈。
      requirement_example: 接近巡逻区域前降低飞行速度，并继续执行航点路线。
    applicable_platform_classes: [air_vehicle, weapon_platform]
    status: partial
    maturity: draft
    provides: []
    accepts:
      - ir: mobility_action.set_air_speed
        display_name: 调整飞行速度
        status: partial
        parameters:
          - {name: target_speed, type: speed, unit: m/s, required: true}
        result: {type: command_status, values: [accepted, rejected], status: unknown}
        side_effects:
          - "请求生效时可改变目标飞行速度及后续运动；速度过渡受导航性能约束。"
    settings:
      - {name: maximum_speed, display_name: 最大速度, type: speed, unit: m/s, required: false, sensitivity: model_characteristic}
      - {name: maximum_climb_rate, display_name: 最大爬升率, type: speed, unit: m/s, required: false, sensitivity: model_characteristic}
    dependencies: []
    constraints: [请求速度必须在所选飞行导航实现的性能包线内。]
    limitations: [仅确认速度操作名称，重载参数与标准化操作结果仍待绑定核实。, 不同飞行导航实现对高度变化和平滑过渡的支持不同。]
    binding: local

  - id: ground_navigation
    display_name: 地面导航
    aliases: []
    domain: mobility
    kind: mover
    description: 沿地形或道路移动并响应行驶速度请求。
    natural_language:
      definition: 将地面平台沿路线引导到目标区域，并在行驶约束内改变速度。
      use_when: 车辆转移、地面巡逻或按道路接近任务区域时。
      expected_result: 平台依照所选地形或道路模型移动，并向请求速度过渡。
      boundaries:
        - 道路最短路径计算仅适用于已配置道路网络的实现。
        - 地形跟随不表示具备通行性判断、交通规则或障碍规避能力。
      requirement_example: 车辆沿给定路线转移，在接近任务区域时降低行驶速度。
    applicable_platform_classes: [ground_vehicle]
    status: partial
    maturity: draft
    provides: []
    accepts:
      - ir: mobility_action.set_ground_speed
        display_name: 调整行驶速度
        status: partial
        parameters:
          - {name: target_speed, type: speed, unit: m/s, required: true}
        result: {type: command_status, values: [accepted, rejected], status: unknown}
        side_effects:
          - "请求生效时可改变目标行驶速度及后续运动；道路与地形约束仍然适用。"
    settings:
      - {name: maximum_speed, display_name: 最大行驶速度, type: speed, unit: m/s, required: false, sensitivity: model_characteristic}
      - {name: road_network_reference, display_name: 道路网络标识, type: string, required: false, sensitivity: public_generic}
    dependencies: []
    constraints: [平台需要具备适用的地面导航组件。]
    limitations: [速度操作的具体重载与执行结果映射尚待核实。, 道路与越野速度限制可能不同。]
    binding: local

  - id: surface_navigation
    display_name: 水面导航
    aliases: []
    domain: mobility
    kind: mover
    description: 在水面沿路线航行并响应航速请求。
    natural_language:
      definition: 使水面平台按任务路线航行，在航行性能限制内调整航速。
      use_when: 水面巡逻、转移或接近任务要求改变航速时。
      expected_result: 平台在水面运动域内向请求航速过渡。
      boundaries:
        - 不包含水动力、海况响应或碰撞规避保证。
        - 不因具有水面导航就认为平台能够下潜。
      requirement_example: 水面平台沿巡逻路线航行，并在接近任务区域时减速。
    applicable_platform_classes: [surface_vessel]
    status: partial
    maturity: draft
    provides: []
    accepts:
      - ir: mobility_action.set_surface_speed
        display_name: 调整水面航速
        status: partial
        parameters:
          - {name: target_speed, type: speed, unit: m/s, required: true}
        result: {type: command_status, values: [accepted, rejected], status: unknown}
        side_effects:
          - "请求生效时可改变目标航速及后续水面运动；实际航速须另行观测。"
    settings:
      - {name: maximum_speed, display_name: 最大水面航速, type: speed, unit: m/s, required: false, sensitivity: model_characteristic}
    dependencies: []
    constraints: [平台必须配置水面导航组件，航速请求应满足其运动约束。]
    limitations: [速度操作的重载参数与结果尚待核实。, 基础水面模型的俯仰与横滚默认不反映海况。]
    binding: local

  - id: subsurface_navigation
    display_name: 水下导航
    aliases: []
    domain: mobility
    kind: mover
    description: 在水下沿任务路线航行，并依据深度状态判断任务条件。
    natural_language:
      definition: 在潜航约束下沿路线运动，并以相对海平面的高度表征深度。
      use_when: 水下转移或巡逻需要根据深度判断是否满足任务条件时。
      expected_result: 平台按水下路线运动，行为获得带垂直基准的深度相关状态。
      boundaries:
        - 不包含声学隐蔽、浮力平衡、海底避碰或自动规避水面能力。
        - 高度向上为正，水下深度不能直接当作正高度使用。
        - 水下状态读取接口仍待确认。
      requirement_example: 潜航平台沿任务路线移动，依据相对海平面的高度检查是否保持在指定深度范围。
    applicable_platform_classes: [subsurface_vehicle]
    status: partial
    maturity: draft
    provides:
      - {ir: mobility_state.altitude_msl, display_name: 相对平均海平面高度, value_type: distance, unit: m, cardinality: one, reference_frame: mean_sea_level_positive_up, freshness: dynamic, status: unknown}
    accepts: []
    settings:
      - {name: maximum_speed, display_name: 最大潜航速度, type: speed, unit: m/s, required: false, sensitivity: model_characteristic}
      - {name: minimum_altitude, display_name: 最低允许高度, type: distance, unit: m, required: false, sensitivity: model_characteristic}
      - {name: maximum_altitude, display_name: 最高允许高度, type: distance, unit: m, required: false, sensitivity: model_characteristic}
    dependencies: [route_navigation]
    constraints: [平台必须配置适合水下运动的导航组件，路线必须满足高度与速度限制。]
    limitations: [相对海平面高度从通用平台状态访问归纳，尚未确认水下专用读取方法。]
    binding: local

  - id: orbital_maneuvering
    display_name: 轨道机动
    aliases: []
    domain: mobility
    kind: mover
    description: 执行受速度增量预算和事件时机约束的轨道变更。
    natural_language:
      definition: 通过给定参考系下的速度增量改变航天平台轨道。
      use_when: 在轨转移、相位调整或接近任务需要改变轨道运动状态时。
      expected_result: 在满足时机、燃料和动力约束时执行轨道变化。
      boundaries:
        - 任务调度成功不等于机动完成或已达到目标轨道。
        - 瞬时与有限时长机动的适用条件不同，有限机动支持范围取决于实现。
        - 不能假设每种轨道传播实现都支持所有机动。
      requirement_example: 在允许的时机沿指定轨道参考系施加速度增量，调整在轨相对位置。
    applicable_platform_classes: [space_vehicle]
    status: partial
    maturity: draft
    provides: []
    accepts:
      - ir: mobility_action.apply_orbital_delta_velocity
        display_name: 执行轨道速度增量
        status: partial
        parameters:
          - {name: reference_frame, type: enumeration, values: [inertial, radial_intrack_crosstrack], required: true}
          - {name: delta_velocity_x, type: speed, unit: m/s, required: true}
          - {name: delta_velocity_y, type: speed, unit: m/s, required: true}
          - {name: delta_velocity_z, type: speed, unit: m/s, required: true}
          - {name: execution_delay, type: duration, unit: s, required: true}
        result: {type: command_status, values: [accepted, rejected], status: unknown}
        side_effects:
          - "可改变待执行的机动事件；实际执行时可改变轨道状态并消耗可用机动预算或推进剂，调度不证明执行完成。"
    settings:
      - {name: delta_velocity_budget, display_name: 可用速度增量预算, type: speed, unit: m/s, required: false, sensitivity: model_characteristic}
      - {name: maximum_acceleration, display_name: 最大机动加速度, type: acceleration, unit: m/s^2, required: false, sensitivity: model_characteristic}
    dependencies: []
    constraints: [需要有效轨道初始状态与可用机动模型。, 执行时必须具备足够速度增量预算或推进剂。]
    limitations: [已确认任务事件执行接口，但事件构造、重载与标准化结果映射仍待核实。, 地球轨道解析模型与数值积分模型的能力边界不同。]
    binding: local

  - id: fuel_status_monitoring
    display_name: 燃料状态监测
    aliases: []
    domain: resource_management
    kind: energy
    description: 按燃料资源监测剩余量和返航、储备及耗尽告警。
    natural_language:
      definition: 将燃料状态变化与对应资源身份关联，为返航和任务中止决策提供依据。
      use_when: 行为需要检查燃料余量或响应预定燃料门限时。
      expected_result: 获得燃料门限事件；可用时读取相应资源剩余燃料质量。
      boundaries:
        - 返航与储备门限是预先设定的值，不是自动计算的返航可达性。
        - 没有消耗模型时，固定的初始燃料质量不能证明动态续航监测能力。
        - 不提供自动加油、燃料转移或通用续航时间预测。
      requirement_example: 某燃料资源触发返航门限后结束巡逻，并在耗尽事件发生时中止依赖推进的任务。
    applicable_platform_classes: [air_vehicle, ground_vehicle, surface_vessel, subsurface_vehicle, space_vehicle, weapon_platform]
    status: partial
    maturity: draft
    provides:
      - {ir: resource_state.fuel_threshold_event, display_name: 燃料门限事件, value_type: enumeration, values: [return_threshold_crossed, reserve_threshold_crossed, empty], cardinality: collection, item_scope: per_resource, key: resource_id, freshness: event_driven, status: supported}
