      - {ir: track_state.affiliation, display_name: 航迹报告敌我关系, value_type: enumeration, values: [friend, foe, neutral, unknown], cardinality: per_track, key: track_id, freshness: dynamic, status: unknown}
      - {ir: track_state.image_recognition_stage, display_name: 图像目标识别阶段, value_type: enumeration, values: [detected, classified, identified], cardinality: per_track, key: track_id, freshness: dynamic, status: partial}
    accepts: []
