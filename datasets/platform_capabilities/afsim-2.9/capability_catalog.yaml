    limitations: [文档确认最终分析文件，运行时行为读取接口未确认，输出保持未知绑定。, 集合统计覆盖至少一个资产，不是每个传感器单独的状态；必须保留覆盖计算及网格身份。, 间隙在评估时段边界会截断，不能直接当成完整周期重访保证。]
