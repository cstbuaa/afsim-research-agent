      boundaries: ["本能力提供模型中的选择规则，不定义具体战术行为，也不保证行为效果。", "基础首个合格只以通过前置条件为决策依据；高级首个成功须执行尝试，先前合格分支执行失败后仍可回退到后续分支。", "高级分支模型成功不等于任务或战术成功；策略描述与节点执行契约分开，本能力不提供独立纯选择或叶行为执行动作。"]
