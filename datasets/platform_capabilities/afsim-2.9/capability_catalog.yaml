unsupported_requests:
  - requested: per_track_execution_isolation
    reason: unknown
    note: "已表达按航迹运行实例的身份，尚未确认实例创建、销毁、共享变量和并发隔离的完整生命周期。"
  - requested: state_specific_evaluation_intervals
    reason: ir_gap
    note: "运行时单一评估周期不能无损表达每个状态独立的周期；首次调度、切换后周期重置、同刻转移及自循环时序仍待确认。"
  - requested: ordered_effectful_transition_evaluation
    reason: ir_gap
    note: "命令接受结果可作为后续判断输入，但能力目录不表达短路顺序、重复可变计算及转移提交前命令的不可回滚副作用；不得把命令调用视为纯条件。"
  - requested: target_belief_lifecycle
    reason: ir_gap
    note: "航迹有效性、身份、质量及命中事件均不能替代目标被认为存活或失效的独立判断；两种信念不保证严格互补，也不等于仿真真值。"
  - requested: target_task_and_active_weapon_counts
    reason: ir_gap
    note: "任务关联和库存不能代替按目标及任务类型统计已分配、已接收任务数，以及按目标统计活动武器数；当前没有对应计数观测契约。"
  - requested: engagement_authority_policy
    reason: ir_gap
    note: "授权结果已保留，目录未表达自主指挥、接收任务和操作等级组成的具体许可策略，不能将指挥官身份或非友方识别单独等同于交战授权。"
  - requested: intercept_feasibility_operands
    reason: ir_gap
    note: "武器目标对的可行性结果已表达，但距离上限、相对航向、武器及计算器有效性、发射延迟和拦截点有效性的有序组合没有无损输入契约；源参数单位未确认时不得猜填。"
  - requested: target_task_cancellation_scope
    reason: unknown
    note: "已表达目标范围取消请求，具体任务类别、在途弹药、重复请求及异步完成范围未确认；不能把无返回值的调用直接解释为取消完成。"
