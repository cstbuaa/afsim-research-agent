    provides: [{"ir":"behavior_selection.selected_behavior","display_name":"一次选择中实际被选的行为标识","value_type":"string","cardinality":"collection","key":"selection_id","item_scope":"per_selector_decision","freshness":"event","status":"partial","metadata":["runtime_id","model_id","tree_kind","selector_id","policy","observation_time"]}]
    accepts: []
