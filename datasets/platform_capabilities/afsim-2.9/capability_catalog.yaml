      use_when: 行为需要区分已探测、已分类、已识别或敌我关系时。
      expected_result: 为每条航迹提供有来源与有效性限制的报告类型和识别结果。
      boundaries: [报告类型与仿真真实平台类型必须区分。, 身份和阵营判别不等于威胁排序或敌对行动授权。]
      requirement_example: 检查目标识别阶段与报告类型，不把未知目标直接当成威胁。
