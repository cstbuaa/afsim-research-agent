    limitations: [实现仅定义人类听觉类型，不证明通用水声能力。, 三分之一倍频程传播与听觉阈值是模型内部机制。, 具体行为读取接口尚未确认，不声明接收声压或方位的直接测量接口。]
    binding: local

  - id: target_detection
    display_name: 目标探测结果获取
    aliases: []
    domain: sensing
    kind: composite
    description: 获取目标被探测并报告的事件结果，保留目标与探测来源身份。
    natural_language:
      definition: 将一次已报告的目标发现作为行为可使用的探测结果。
      use_when: 行为需要判断某个目标是否已经被观测来源报告时。
      expected_result: 收到指向特定目标航迹的探测事件，供行为启动后续处理。
      boundaries: [探测事件不承诺后续持续更新或稳定跟踪。, 不把预置目标或直接从真实平台构造的航迹当成传感器探测。]
      requirement_example: 首次收到真实传感器来源的目标报告后启动复核流程。
    applicable_platform_classes: [air_vehicle, ground_vehicle, surface_vessel, subsurface_vehicle, space_vehicle, static_node, weapon_platform]
    status: partial
    maturity: draft
    provides:
      - {ir: sensing_result.target_detected, display_name: 已报告的目标探测事件, value_type: enumeration, values: [detected], cardinality: per_track, key: track_id, source_key: sensor_id, freshness: event, status: partial}
    accepts: []
    settings: []
    dependencies: []
    constraints: [必须保留实际观测来源与目标航迹的关联。, 航迹消息用于探测结果时必须满足该来源的报告与建迹条件。]
    limitations: [未收到事件不等于证明目标不存在。, 低于建迹门限的单次命中未必形成航迹报告，不能把每次尝试都当成已探测。, 消息接入与标准事件映射仍需实现。]
    binding: local

  - id: target_tracking
    display_name: 目标持续跟踪
    aliases: []
    domain: tracking
    kind: composite
    description: 维护特定目标随时间更新的感知航迹，提供位置及其有效性。
    natural_language:
      definition: 通过连续测量或后续报告更新同一目标的航迹状态。
      use_when: 行为需要依据目标随时间变化的位置作决策时。
      expected_result: 为每条目标航迹保留独立的感知位置和位置有效性。
      boundaries: [一次发现不等于已具备稳定持续跟踪。, 测量、滤波估计和真实平台位置必须区分。]
      requirement_example: 持续检查目标航迹的位置有效性，仅对有效的位置更新采取行动。
    applicable_platform_classes: [air_vehicle, ground_vehicle, surface_vessel, subsurface_vehicle, space_vehicle, static_node, weapon_platform]
    status: available
    maturity: draft
    provides:
      - {ir: track_state.latitude, display_name: 航迹感知纬度, value_type: angle, unit: deg, cardinality: per_track, key: track_id, freshness: dynamic, status: supported}
      - {ir: track_state.longitude, display_name: 航迹感知经度, value_type: angle, unit: deg, cardinality: per_track, key: track_id, freshness: dynamic, status: supported}
      - {ir: track_state.location_valid, display_name: 航迹位置有效性, value_type: boolean, cardinality: per_track, key: track_id, freshness: dynamic, status: supported}
    accepts: []
    settings:
      - {name: maintain_hits_required, display_name: 维持航迹所需命中数, type: count, unit: count, required: false, sensitivity: model_characteristic}
      - {name: maintain_attempt_window, display_name: 维持航迹检测窗口次数, type: count, unit: count, required: false, sensitivity: model_characteristic}
    dependencies: []
    constraints: [必须存在可访问的目标航迹，使用位置前必须检查有效性。]
    limitations: [该能力读取持续维护的航迹，不提供通用启停跟踪动作。, 航迹可能是过时外推结果或由真实数据初始化，来源和时效仍需检查。, 任务状态机之外必须显式获取航迹引用。]
    binding: local

  - id: track_management
    display_name: 航迹管理
    aliases: []
    domain: tracking
    kind: processor
    description: 按航迹身份访问管理列表并获知航迹生命周期变化。
    natural_language:
      definition: 维护主列表或独立备用列表中的航迹及创建、更新和移除状态。
      use_when: 行为需要逐条遍历目标或响应航迹生命周期变化时。
      expected_result: 获得明确列表中的独立航迹引用与生命周期通知。
      boundaries: [列表管理不决定传感器探测物理。, 主列表与备用列表不能隐式合并，管理不等于滤波、关联或融合。]
      requirement_example: 遍历本平台主航迹列表，对每条新建或丢失航迹分别处理。
    applicable_platform_classes: [air_vehicle, ground_vehicle, surface_vessel, subsurface_vehicle, space_vehicle, static_node, weapon_platform]
    status: partial
    maturity: draft
    provides:
      - {ir: track_state.managed_track, display_name: 受管理航迹引用, value_type: track_reference, cardinality: per_track, key: track_id, freshness: dynamic, status: supported}
      - {ir: track_state.lifecycle_event, display_name: 航迹生命周期事件, value_type: enumeration, values: [created, updated, dropped, removed], cardinality: per_track, key: track_id, freshness: event, status: partial}
    accepts: []
    settings:
      - {name: stale_track_lifetime, display_name: 未更新航迹保留时限, type: duration, unit: s, required: false, sensitivity: public_generic}
    dependencies: []
    constraints: [必须指定要访问的管理列表及航迹身份。, 活动任务可能阻止清除相关航迹。]
    limitations: [不承诺任意运行时删除、合并或创建航迹接口。, 非主处理器的清除设置存在不同语义，不能照搬主处理器设置。, 生命周期通知转换尚未完全绑定。]
    binding: local

  - id: track_filtering
    display_name: 航迹滤波
    aliases: []
    domain: tracking
    kind: processor
    description: 从连续测量生成经过滤波的目标位置估计。
    natural_language:
      definition: 按单条航迹处理测量序列，读取滤波后的位置估计。
      use_when: 行为需要使用平滑后的目标状态而非直接原始测量时。
      expected_result: 得到带航迹身份且满足滤波输出有效性条件的位置估计。
      boundaries: [滤波不判断不同报告是否属于同一实体。, 滤波不等于多源融合或列表筛选。]
      requirement_example: 在滤波结果有效后使用目标位置，保留该估计的航迹和来源。
    applicable_platform_classes: [air_vehicle, ground_vehicle, surface_vessel, subsurface_vehicle, space_vehicle, static_node, weapon_platform]
    status: partial
    maturity: draft
    provides:
      - {ir: track_state.filtered_latitude, display_name: 滤波后目标纬度, value_type: angle, unit: deg, cardinality: per_track, key: track_id, freshness: dynamic, status: partial}
      - {ir: track_state.filtered_longitude, display_name: 滤波后目标经度, value_type: angle, unit: deg, cardinality: per_track, key: track_id, freshness: dynamic, status: partial}
    accepts: []
    settings: []
    dependencies: [target_tracking]
    constraints: [需要在传感器或航迹管理器关联适用滤波器。, 必须确认航迹确实经过滤波且位置有效。]
    limitations: [初始滤波状态可能不稳定，不能承诺立即获得可靠速度或协方差。, 静态图像不应用视频滤波器。, 滤波配置不是运行时选择滤波算法的动作，具体滤波标记读取接口尚未确认。]
    binding: local

  - id: track_correlation
    display_name: 航迹关联
    aliases: []
    domain: tracking
    kind: processor
    description: 判断新报告对应哪条已有本地航迹，并保留关联结果。
    natural_language:
      definition: 将测量或原始航迹匹配到同一实体的本地航迹，无法匹配时形成新航迹。
      use_when: 行为需要知道新来源报告是否属于已知目标时。
      expected_result: 获得按输入航迹区分的本地航迹关联结果。
      boundaries: [关联决定身份对应关系，不合成测量值。, 使用真实身份进行完美关联不代表真实传感器识别能力。]
      requirement_example: 对新传感器报告识别其对应的本地航迹后，再执行后续融合。
    applicable_platform_classes: [air_vehicle, ground_vehicle, surface_vessel, subsurface_vehicle, space_vehicle, static_node, weapon_platform]
    status: partial
    maturity: draft
    provides:
      - {ir: track_state.correlated_local_track, display_name: 对应本地航迹引用, value_type: track_reference, cardinality: per_track, key: track_id, freshness: dynamic, status: unknown}
    accepts: []
    settings: []
    dependencies: [track_management]
    constraints: [需要选择适用的关联方法并保持输入航迹与本地航迹的身份映射。]
    limitations: [没有确认直接读取关联映射的脚本接口。, 依赖真实平台身份的方法不能用于证明高保真错配处理。, 统计关联依赖误差和协方差信息，特定联合跟踪器要求关联与融合方法配套。]
    binding: local

  - id: track_fusion
    display_name: 航迹融合
    aliases: []
    domain: tracking
    kind: processor
    description: 合并已关联的多源目标信息，并读取本地航迹的贡献来源数量。
    natural_language:
      definition: 将属于同一实体的多源报告形成统一的本地航迹状态。
      use_when: 行为需要利用多个来源对同一目标的综合信息时。
      expected_result: 得到本地融合航迹，并能按航迹检查其贡献报告数量。
      boundaries: [关联先决定实体匹配，融合再合并信息。, 贡献数量不等于置信度，也不能单独证明多个独立传感器同时观测。]
      requirement_example: 使用融合航迹前检查其仍有贡献报告，再结合时效与质量判断。
    applicable_platform_classes: [air_vehicle, ground_vehicle, surface_vessel, subsurface_vehicle, space_vehicle, static_node, weapon_platform]
    status: partial
    maturity: draft
    provides:
      - {ir: track_state.fusion_contributor_count, display_name: 融合航迹原始贡献数, value_type: count, unit: count, cardinality: per_track, key: track_id, freshness: dynamic, status: supported}
      - {ir: track_state.fused_latitude, display_name: 融合目标纬度, value_type: angle, unit: deg, cardinality: per_track, key: track_id, freshness: dynamic, status: partial}
      - {ir: track_state.fused_longitude, display_name: 融合目标经度, value_type: angle, unit: deg, cardinality: per_track, key: track_id, freshness: dynamic, status: partial}
    accepts: []
    settings: []
    dependencies: [track_management, track_correlation]
    constraints: [输入报告须被关联到同一目标，输出须来自相应本地航迹。, 协方差加权需要可用协方差或可用于构造协方差的测量误差。]
    limitations: [替换融合不保证精度优于所有输入。, 循环报告必须防止重复同化，不能将相关数据当成独立证据。, 相干传感器交互合成与本地航迹融合处于不同层次，不能互换接口。]
    binding: local

  - id: track_identification
