    status: available
    maturity: draft
    provides:
      - {ir: track_state.quality, display_name: 航迹质量分值, value_type: real, unit: "1", cardinality: per_track, key: track_id, freshness: dynamic, status: supported}
      - {ir: track_state.age, display_name: 距上次航迹更新时间, value_type: duration, unit: s, cardinality: per_track, key: track_id, freshness: dynamic, status: supported}
